title: 'SPEC: Agent-facing read-only records API — bolted-in GET endpoints with admin-issued
  key+secret auth'
status: open
labels:
- needs-approval
- spec
body: "# SPEC: Agent-facing read-only records API — bolted-in GET endpoints with admin-issued\
  \ key+secret auth\n\n## User Intent / Original Prompt\n\nThe developer (2026-10-07)\
  \ directed, verbatim:\n\n> \"an API endpoint managed by the Streamlit app that an\
  \ agent can PULL from for getting a DB dump for use. An admin view added that allows\
  \ setting up key+secret pairs for API access. GET requests mainly. Records only\
  \ (linguistic data).\"\n\nSecurity directive, verbatim: *\"Assume we never want\
  \ agents accessing things via the db from other projects as a major security risk\"\
  * — the API is the sole sanctioned remote data surface; it must not expose DB connectivity\
  \ to other projects.\n\nBinding design decisions from the 2026-10-07 discussion:\
  \ routes are bolted into the Streamlit server's own Tornado application — *\"it\
  \ would be better to have routes bolted in, all with a single parent api folder\
  \ so that the actual api endpoints can then be named as needed\"*; a FastAPI sidecar\
  \ is IMPOSSIBLE on Streamlit Community Cloud (single process, one port); GET-only,\
  \ records-only scope; key+secret pairs issued via an admin view with hashed secret\
  \ storage and audit events into the existing `system_event_log`.\n\n## Intent /\
  \ Executive Summary\n\nAdd an agent-facing, read-only HTTP API managed by the Streamlit\
  \ app itself: `GET /api/v1/records` serves the app's linguistic record data (the\
  \ `records` lexical-entry table) as a single JSON dump for consumption by agents\
  \ in other projects. Routes are bolted into the Streamlit server's running Tornado\
  \ application from app code — no sidecar process, one port, Community Cloud compatible\
  \ — with all API code under a single parent package (`src/api/`) whose per-endpoint\
  \ route modules name their own paths. Access is gated by key+secret pairs issued\
  \ through a new admin-gated admin view: secrets are stored hashed (never plaintext),\
  \ shown exactly once at issuance, and support enable/disable/regenerate/revoke;\
  \ key lifecycle events and failed-auth attempts are audited into the existing `system_event_log`.\
  \ The endpoint never exposes DB connectivity — other projects' agents consume only\
  \ the HTTP API with issued keys.\n\n## Root Cause\n\nThe app's linguistic record\
  \ data lives in PostgreSQL reachable only from inside the app's own process and\
  \ infrastructure. Agents in other projects (downstream language tools, analysis\
  \ scripts) currently have no sanctioned way to consume the dataset: the only paths\
  \ would be direct DB credentials — explicitly forbidden as a major security risk\
  \ — or manual one-off exports. There is no HTTP surface, no API credential management,\
  \ and no audit trail for programmatic access.\n\n## Approach\n\n1. **Route bolt-in\
  \ (verified mechanism).** A registrar module (`src/api/registrar.py`) is invoked\
  \ from `streamlit_app.py` at first script run (after database initialization). It\
  \ gc-finds the running `tornado.web.Application` instance(s) and prepends `tornado.web.Rule(tornado.routing.PathMatches(pattern),\
  \ Handler)` entries to `app.wildcard_router.rules` ahead of Streamlit's catch-all\
  \ — the specific endpoint rule (`/api/v1/records`) first, then a `/api/.*` catch-all\
  \ rule serving the JSON 404 contract. Streamlit's own routes remain untouched behind\
  \ the prepended block. Route handlers run outside Streamlit's script-runner context:\
  \ they never use `st.*` APIs or session state; they access the database only through\
  \ the shared engine/session factory.\n2. **Single parent API package.** All API\
  \ code lives under `src/api/`: the registrar, request authentication (`src/api/auth.py`),\
  \ and per-endpoint route modules (`src/api/routes/*.py`) — each module defines its\
  \ own path pattern and handler, so endpoints are named as needed within the one\
  \ parent.\n3. **Key+secret credentials.** A new `api_keys` table (model + migration\
  \ on the existing migrations stack) and `src/services/api_key_service.py` implement\
  \ create / regenerate-secret / enable / disable / revoke. Secrets are generated\
  \ with the stdlib `secrets` module (≥256-bit) and stored ONLY as PBKDF2-HMAC-SHA256\
  \ hashes (per-secret random salt, 600,000 iterations, versioned string format);\
  \ the plaintext secret is displayed exactly once in the admin view and never persisted,\
  \ logged, or embedded in audit events.\n4. **Admin view.** `src/frontend/pages/api_keys.py`\
  \ is registered in the Admin section of the navigation tree (admin-gated like the\
  \ other admin pages): key list, create pair, regenerate secret, enable/disable,\
  \ revoke with confirmation.\n5. **Dump endpoint.** `GET /api/v1/records` serves\
  \ live (`is_deleted = false`) `records` rows as a single JSON response, ordered\
  \ by ascending id, serialized against a closed field whitelist with the resolved\
  \ source name and primary-first language codes embedded so each record is self-contained.\n\
  6. **Request hardening.** Constant-time credential comparison; per-key fixed-window\
  \ rate limit (429 + `Retry-After`); a JSON error contract for 401/403/404/405/429/503;\
  \ failed-auth attempts logged to `system_event_log`.\n\n## Verified Mechanism (probe\
  \ evidence, 2026-10-07)\n\nGrounding for R-2 through R-4 — empirically verified\
  \ live on this project's pinned stack:\n\n- **Versions:** Streamlit 1.54.0 and Tornado\
  \ 6.5.4 (both pinned in `uv.lock`), matching the probe environment exactly.\n- **Probe\
  \ behavior:** a minimal Streamlit app on :8505 executed the bolt at first script\
  \ run. `gc.get_objects()` filtered to `tornado.web.Application` found exactly 1\
  \ instance; `wildcard_router.rules.insert(0, tornado.web.Rule(tornado.routing.PathMatches(\"\
  /api/probe\"), Handler))` prepended successfully (rule count 11 → 12). A real browser\
  \ then fetched `GET /api/probe` and received `{\"bolted\": true}` served by the\
  \ same process. Streamlit's own routes were present and untouched (the prepend landed\
  \ ahead of the catch-all).\n- **Probe artifacts:** `/tmp/opencode/st-api-probe/`\
  \ (`app.py`, `bolt.log`) — ephemeral probe workspace; not committed to the repository.\n\
  - **Encoded constraints:**\n  - (a) The bolt is a one-shot at first script run and\
  \ persists for the server lifetime — and MUST be idempotent (rerun-safe). The probe's\
  \ `st.session_state` guard is adequate only for a single browser session (session\
  \ state is per-session, so a second session would re-bolt and stack duplicate rules);\
  \ the production guard is therefore a module-level latch PLUS a structural route-presence\
  \ check that scans existing rules for the same path patterns before inserting (R-3).\n\
  \  - (b) `wildcard_router` is an internal Streamlit/Tornado structure. The spec\
  \ pins Streamlit 1.54.0 / Tornado 6.5.4 and requires a startup self-check — a route-presence\
  \ assertion logged at bolt time, including both version numbers (R-4) — plus a documented\
  \ failure mode: if the structure is missing or changed, log loudly, leave the app\
  \ running, disable the API; never crash the UI.\n  - (c) Community Cloud compatibility\
  \ follows from the same single-process mechanism. Community Cloud's own constraints\
  \ are recorded as deployment considerations: the database is configured via the\
  \ secrets store (works unchanged — the bolted handlers read the same connection\
  \ factory), no long-running sidecar processes are permitted (the bolted-in design\
  \ has none — a sidecar was impossible anyway), and the platform runs a single process/instance\
  \ (consistent with the module-level latch and in-memory rate limiter). HTTPS is\
  \ terminated by the platform, so key+secret headers travel encrypted.\n\n## Alternatives\
  \ Considered\n\n| Alternative | Rejected Because |\n|---|---|\n| FastAPI (or any)\
  \ sidecar service | Impossible on Streamlit Community Cloud — single process, single\
  \ port; a second listening process cannot be hosted. Bolted-in routes are the chosen\
  \ shape and are empirically proven |\n| Direct DB credentials / read replica for\
  \ other projects | Developer directive: never — agents accessing the DB from other\
  \ projects is a major security risk; the DB gains no new exposure |\n| Public unauthenticated\
  \ endpoint | Records are the community's curated dataset; unauthenticated pull permits\
  \ uncontrolled scraping with no audit trail and no revocation path |\n| `Authorization:\
  \ Bearer <token>` | A single token conflates identifier and credential, preventing\
  \ independent rotation of key vs secret; key+secret headers keep them distinct |\n\
  | HMAC request signing (AWS-style) | Unnecessary complexity for a read-only GET\
  \ surface over platform-terminated HTTPS |\n| JSONL response format | A single JSON\
  \ response is sufficient at ~7,753 records; JSONL adds a second format to test with\
  \ no consumer requirement yet |\n| Streaming / chunked pagination | The dump is\
  \ small (single response acceptable per developer directive); pagination is a follow-up\
  \ if dumps grow |\n| Write API (POST/PUT/DELETE) | Out of scope — the surface is\
  \ a read-only dump; write safety and workflow are separate concerns |\n| WSGI-mounted\
  \ Flask/FastAPI inside Tornado | The same bolt-in complexity plus a new framework\
  \ dependency; Tornado handlers are already available in-process with zero new dependencies\
  \ |\n\n## Key Decisions\n\n- **Bolted-in Tornado routes over any sidecar** — single\
  \ process, one port; empirically proven on the pinned versions\n- **gc-discovery\
  \ + rules-prepend** — no public Streamlit extension API exists for arbitrary routes;\
  \ the registrar finds the live Application instance(s) at first script run\n- **Idempotency\
  \ = module-level latch + structural route-presence check** — the probe's `session_state`\
  \ guard is per-browser-session and insufficient alone; production requires cross-session\
  \ rerun safety\n- **Graceful degradation over hard coupling** — `wildcard_router`\
  \ is internal; if it disappears on an upgrade, the API disables with a loud log\
  \ while the UI continues\n- **Version pinning** — the mechanism is specified against\
  \ Streamlit 1.54.0 / Tornado 6.5.4 (both in `uv.lock`); Phase 0 re-verifies before\
  \ implementation\n- **Single parent package `src/api/`** — all API code (registrar,\
  \ auth, routes) under one parent; endpoints named as needed in `src/api/routes/`\n\
  - **`GET /api/v1/records`, one endpoint in v1** — the `/api/v1` prefix leaves room\
  \ for future endpoints without path ambiguity; no health/probe route is shipped\
  \ (the self-check is structural)\n- **`X-API-Key` + `X-API-Secret` headers** — the\
  \ key identifies, the secret authenticates; constant-time comparison; uniform 401\
  \ message that never distinguishes unknown key from bad secret\n- **Password-grade\
  \ hashing for secrets** — PBKDF2-HMAC-SHA256, per-secret random salt, 600,000 iterations,\
  \ versioned hash string; plaintext never persisted\n- **Records-only payload with\
  \ resolved references** — closed field whitelist; source name and language codes\
  \ embedded so the dump is self-contained; the embedding vector, lock state, and\
  \ internal user-identity columns are excluded\n- **`system_event_log` as the audit\
  \ sink** — the #1332 `EventLogService` infra is reused for key lifecycle and auth-failure\
  \ events\n- **Stdlib-only implementation** — `gc`, `hashlib`, `hmac`, `secrets`,\
  \ `json`; Tornado already present; no new dependencies\n- **Rate-limit-lite included**\
  \ — per-key fixed window (default 60 requests per 60 seconds), in-memory per process,\
  \ 429 + `Retry-After`\n\n## Interface Contract\n\n### Endpoints (v1)\n\n| Method\
  \ | Path | Auth | Purpose |\n|---|---|---|---|\n| GET | `/api/v1/records` | key+secret\
  \ required | Full dump of live linguistic records |\n| any | `/api/.*` (no endpoint\
  \ matched) | none processed | JSON 404 catch-all — unknown API paths never fall\
  \ through to the UI |\n\n### Authentication\n\n- Headers: `X-API-Key: <key>` and\
  \ `X-API-Secret: <secret>` — both required on every API request.\n- The key is a\
  \ unique public identifier (`snea_` prefix + `secrets.token_urlsafe(16)`); the secret\
  \ is a ≥256-bit credential (`secrets.token_urlsafe(32)`).\n- Verification: lookup\
  \ by key, then constant-time comparison (`hmac.compare_digest`) of the PBKDF2 hash\
  \ of the presented secret. Header values are compared as received (no trimming or\
  \ case normalization of values).\n- Status semantics: **401** for missing headers\
  \ / unknown key / wrong secret — one uniform message, never distinguishing unknown\
  \ key from bad secret; **403** for a known key that is disabled or revoked.\n\n\
  ### Success response (200)\n\n```json\n{\n  \"count\": 7753,\n  \"records\": [\n\
  \    {\n      \"id\": 123,\n      \"lx\": \"…\",\n      \"sort_lx\": \"…\",\n  \
  \    \"hm\": 1,\n      \"ps\": \"…\",\n      \"ge\": \"…\",\n      \"source_id\"\
  : 2,\n      \"source_page\": \"…\",\n      \"status\": \"approved\",\n      \"mdf_data\"\
  : \"…\",\n      \"current_version\": 4,\n      \"is_deleted\": false,\n      \"\
  updated_at\": \"2026-10-07T12:00:00+00:00\",\n      \"source\": \"…\",\n      \"\
  languages\": [\"<primary-code>\", \"…\"]\n    }\n  ]\n}\n```\n\n- The field whitelist\
  \ is CLOSED — exactly the 15 fields above; no other `records` column is ever serialized.\
  \ Excluded by design: `embedding` (derived search vector, not linguistic data),\
  \ `is_locked`/`locked_by`/`locked_at`/`lock_note` (operational lock state), `updated_by`/`reviewed_by`/`reviewed_at`\
  \ (internal user identities).\n- `source` is the resolved `sources.name`; `languages`\
  \ is the record's language codes ordered primary-first.\n- Ordering: ascending `id`.\
  \ Only live records (`is_deleted = false`) are served.\n- Timestamps: ISO 8601 UTC.\
  \ `count` equals the number of records in the response.\n\n### Error contract\n\n\
  All API responses carry `Content-Type: application/json; charset=utf-8`. Error body\
  \ shape: `{\"error\": {\"code\": \"<code>\", \"message\": \"<generic message>\"\
  }}` — messages are static/generic and never include DB connection details, host\
  \ names, SQL, or stack traces.\n\n| Status | `code` | When |\n|---|---|---|\n| 401\
  \ | `unauthorized` | missing headers, unknown key, wrong secret |\n| 403 | `key_disabled`\
  \ | key known but disabled or revoked |\n| 404 | `not_found` | path under `/api/`\
  \ matching no endpoint |\n| 405 | `method_not_allowed` | non-GET on a defined API\
  \ route |\n| 429 | `rate_limited` | per-key window exceeded; includes `Retry-After`\
  \ header |\n| 503 | `service_unavailable` | database unavailable |\n\n### Response\
  \ encoding\n\n- JSON serialized with `ensure_ascii=False` — Unicode (ə, ŋ, ã, č,\
  \ ꝏ, combining diacritics) is emitted as raw UTF-8, never `\\u`-escaped, and never\
  \ normalized (project data-integrity rules).\n- Success responses are a single JSON\
  \ document (no pagination in v1).\n\n## Not Included\n\n- **Write paths** — no POST/PUT/DELETE/PATCH\
  \ on any API route; the surface is read-only.\n- **Tables beyond linguistic records**\
  \ — `users`, `permissions`, `user_activity_log`, `system_event_log`, `edit_history`,\
  \ `matchup_queue`, the search/FTS index tables, `schema_version`, and any secrets/config\
  \ storage are never served; the closed whitelist in the Interface Contract is the\
  \ entire data surface.\n- **Cross-project DB access** — the endpoint never exposes\
  \ connection strings, hosts, ports, or sockets; other projects consume only the\
  \ HTTP API with issued keys; the DB gains no new exposure of any kind.\n- **Pagination,\
  \ streaming, JSONL** — single JSON response; revisit only if the dump outgrows it.\n\
  - **Query parameters / filters** — the dump is the whole live dataset; unexpected\
  \ query parameters are ignored (no 400 path).\n- **OAuth/JWT/token infrastructure**\
  \ — key+secret pairs are the only credential type.\n- **Key expiry dates** — revocation\
  \ covers the lifecycle; expiring keys are a follow-up if needed.\n- **Per-endpoint\
  \ or per-IP rate limiting** — one per-key limit applies uniformly.\n- **A health/probe\
  \ endpoint** — the startup self-check is structural (logged route-presence assertion);\
  \ no unauthenticated liveness route is shipped, and the feasibility probe's `/api/probe`\
  \ endpoint is not part of the deliverable.\n- **A FastAPI or other sidecar process**\
  \ — impossible on Community Cloud and superseded by the bolted-in mechanism.\n\n\
  ## Dependencies\n\n| Dependency | Purpose | Version/Constraint | Availability Requirement\
  \ |\n|---|---|---|---|\n| Streamlit | Host server whose Tornado app receives the\
  \ bolted routes | 1.54.0 (`uv.lock`) — the verified mechanism is pinned to this\
  \ version | Already the app framework |\n| Tornado | Routing/HTTP layer receiving\
  \ the prepended rules | 6.5.4 (`uv.lock`) — pinned | Already a Streamlit dependency\
  \ |\n| Python stdlib (`gc`, `hashlib`, `hmac`, `secrets`, `json`) | Registrar, hashing,\
  \ credential generation, serialization | Python 3.12+ | No new dependency |\n| PostgreSQL\
  \ / SQLAlchemy | `api_keys` table, records query, audit writes | Existing stack\
  \ | Existing |\n| `EventLogService` (#1332) | Audit sink for key lifecycle + auth\
  \ failures | Existing | `system_event_log` table present |\n\n## Preconditions\n\
  \n- Phase 0 re-verification has passed: the bolt probe re-run against the current\
  \ pinned versions confirms rule-prepend and same-process serving before implementation\
  \ begins.\n- The `system_event_log` table and `EventLogService` are available (existing\
  \ #1332 infra).\n- The local database is synced from production before regression\
  \ testing, per the repository's regression-test protocol.\n\n## Requirements\n\n\
  ### SHALL Requirements\n\n- **R-1. Single parent API package.** All API code SHALL\
  \ live under one parent package `src/api/`: the registrar (`src/api/registrar.py`),\
  \ request authentication (`src/api/auth.py`), and per-endpoint route modules (`src/api/routes/*.py`)\
  \ — each route module defines its path pattern and handler; new endpoints are added\
  \ as new modules under this parent.\n- **R-2. Bolt mechanism.** At first script\
  \ run of the app, `streamlit_app.py` SHALL invoke the registrar, which gc-finds\
  \ the running `tornado.web.Application` instance(s) and prepends routing rules to\
  \ `wildcard_router.rules` ahead of Streamlit's catch-all — specific endpoint rules\
  \ first, then the `/api/.*` JSON-404 catch-all — per the verified mechanism. Route\
  \ handlers run outside Streamlit's script-runner context and SHALL NOT use `st.*`\
  \ APIs or `st.session_state`; they access the database only through the shared engine/session\
  \ factory.\n- **R-3. Idempotency.** The bolt SHALL be a no-op when the routes are\
  \ already present: a module-level latch plus a structural route-presence check (scanning\
  \ existing rules for the same path patterns) SHALL prevent duplicate rules across\
  \ script reruns, distinct browser sessions, and module reloads.\n- **R-4. Startup\
  \ self-check + failure mode.** After bolting, the registrar SHALL log a route-presence\
  \ assertion (rules found/inserted, order, pattern list, Application instance count)\
  \ including the Streamlit and Tornado version numbers. If the Application or `wildcard_router.rules`\
  \ structure is not found, the registrar SHALL log a loud error naming the mismatch,\
  \ leave the API disabled, and the app SHALL continue running normally — no exception\
  \ may propagate into the UI script path.\n- **R-5. Credential scheme.** Requests\
  \ SHALL authenticate via `X-API-Key` + `X-API-Secret` headers; verification SHALL\
  \ use constant-time comparison; 401 SHALL be returned for missing/unknown/invalid\
  \ credentials with a single uniform message, 403 for a known key that is disabled\
  \ or revoked.\n- **R-6. Key storage.** A new `api_keys` table (migration via the\
  \ existing migrations stack) SHALL store: `id`, `key` (unique), `secret_hash`, `label`,\
  \ `created_by`, `created_at`, `enabled`, `revoked_at`, `last_used_at`. Secrets SHALL\
  \ be generated with the stdlib `secrets` module (≥256-bit entropy) and stored ONLY\
  \ as PBKDF2-HMAC-SHA256 hashes (per-secret random salt, 600,000 iterations, versioned\
  \ string format `pbkdf2_sha256$<iterations>$<salt_b64>$<hash_b64>`); plaintext secrets\
  \ SHALL never be persisted, logged, or embedded in audit events. `last_used_at`\
  \ SHALL be updated on successful authentication.\n- **R-7. Key lifecycle + audit.**\
  \ The key service SHALL support create, regenerate-secret (replaces the stored hash;\
  \ the old secret is invalid immediately), enable, disable, and revoke (soft mark\
  \ via `revoked_at`; rows retained for audit). Each lifecycle operation SHALL be\
  \ audited into `system_event_log` via `EventLogService` with event types `api_key_created`,\
  \ `api_key_regenerated`, `api_key_enabled`, `api_key_disabled`, `api_key_revoked`\
  \ — details identifying the key and acting admin, never containing secret material.\n\
  - **R-8. Admin view.** A new page (`src/frontend/pages/api_keys.py`) SHALL be registered\
  \ in the Admin section of the navigation (admin-gated like the other admin pages)\
  \ and SHALL provide: the key list (label, key identifier, created, last used, status),\
  \ create pair (secret displayed exactly once), regenerate secret (displayed exactly\
  \ once), enable/disable, and revoke with confirmation. It SHALL never redisplay\
  \ an existing secret.\n- **R-9. Dump endpoint scope.** `GET /api/v1/records` SHALL\
  \ serve the live records (`is_deleted = false`) of the `records` table as a single\
  \ JSON response, ordered by ascending id, each record serialized with EXACTLY the\
  \ closed 15-field whitelist defined in the Interface Contract (including the resolved\
  \ `source` name and primary-first `languages` codes); no other column, table, or\
  \ derived index (`embedding`) is ever serialized.\n- **R-10. Response encoding.**\
  \ All API responses SHALL be `application/json; charset=utf-8` serialized with `ensure_ascii=False`;\
  \ linguistic content SHALL be preserved byte-exact from the database — no normalization,\
  \ stripping, or re-encoding of Unicode; timestamps SHALL be ISO 8601 UTC.\n- **R-11.\
  \ Error contract.** Every API error response SHALL use the JSON error body shape\
  \ defined in the Interface Contract with static generic messages; no error response\
  \ SHALL include DB connection details, hosts, SQL, or stack traces.\n- **R-12. Method\
  \ + path scoping.** Non-GET methods on defined API routes SHALL receive 405 (JSON);\
  \ paths under `/api/` matching no endpoint SHALL receive the JSON 404 catch-all;\
  \ Streamlit's own routes and UI behavior SHALL remain unchanged.\n- **R-13. Auth-failure\
  \ logging.** Every failed authentication attempt (401 and 403 outcomes) SHALL be\
  \ logged into `system_event_log` via `EventLogService` as `api_auth_failure` with\
  \ the presented key identifier (if parseable), the outcome, and the client address\
  \ — never the presented secret.\n- **R-14. Rate-limit-lite.** Each key SHALL be\
  \ limited to a fixed window of 60 requests per 60 seconds (default; overridable\
  \ via the `api.rate_limit_per_minute` secrets key); exceeding the window SHALL return\
  \ 429 with a `Retry-After` header; the limiter SHALL be in-memory per process (consistent\
  \ with single-process hosting).\n\n## Success Criteria\n\n| ID | Criterion | Evidence\
  \ Type | Verification Method | Cost Frame |\n|----|-----------|---------------|---------------------|------------|\n\
  | SC-1 | With the app running, `GET /api/v1/records` on the Streamlit server's port\
  \ is served by the same process: an unauthenticated request returns 401 with the\
  \ JSON error body, proving the bolted route is live ahead of Streamlit's catch-all\
  \ | `behavioral` | Start the live app locally; issue `GET /api/v1/records` with\
  \ no credentials; assert HTTP 401 with the JSON error shape; correlate with the\
  \ bolt self-check log line from the same process | Running the live-app request\
  \ check costs minutes of execution time — a bounded delay that surfaces a routing\
  \ or bolt defect before it reaches consumers. Skipping this verification means an\
  \ API route that never gets served (or breaks the UI's catch-all) ships to production\
  \ and costs 1000× more to fix. Correctness is the only metric. |\n| SC-2 | At startup\
  \ the registrar logs the route-presence self-check naming the inserted patterns\
  \ in order and the Streamlit + Tornado versions | `behavioral` | Start the app;\
  \ capture logs; assert the self-check line lists `/api/v1/records` ahead of the\
  \ `/api/.*` catch-all and includes both version numbers | Reading the startup log\
  \ costs seconds of execution time — a bounded delay that surfaces a silent mis-bolt\
  \ before it reaches consumers. Skipping this verification means a bolt that quietly\
  \ failed (or landed in the wrong position) ships to production and costs 1000× more\
  \ to fix. Correctness is the only metric. |\n| SC-3 | When the Application or `wildcard_router`\
  \ structure is absent (registrar exercised against a structure-less Application),\
  \ the registrar logs a loud error naming the mismatch, reports the API disabled,\
  \ and raises nothing; the live UI continues to run normally | `behavioral` | Unit-exercise\
  \ the registrar against a structure-less Application fixture (assert loud log +\
  \ no exception); Playwright against the live app asserting normal UI operation |\
  \ Running the failure-path fixture and UI check costs minutes of execution time\
  \ — a bounded delay that surfaces a crash-the-UI defect before it reaches users.\
  \ Skipping this verification means a Streamlit upgrade that changes the internal\
  \ structure takes the whole app down instead of just the API, which costs 1000×\
  \ more to fix. Correctness is the only metric. |\n| SC-4 | The bolt is idempotent:\
  \ invoking the registrar repeatedly (reruns, distinct sessions, reloads) leaves\
  \ exactly one rule per API pattern — no duplicates | `behavioral` | Unit-test: invoke\
  \ the registrar repeatedly against the same Application fixture and assert the rule\
  \ count is unchanged after the first bolt; corroborate with the self-check log across\
  \ two distinct browser sessions | Running the repeated-bolt assertions costs seconds\
  \ of execution time — a bounded delay that surfaces a duplicate-rule defect before\
  \ it reaches consumers. Skipping this verification means session reruns quietly\
  \ stack duplicate rules and degrade routing, which ships to production and costs\
  \ 1000× more to fix. Correctness is the only metric. |\n| SC-5 | The auth + method\
  \ matrix holds: valid pair → 200; unknown key → 401; wrong secret → 401 (uniform\
  \ message); disabled key → 403; revoked key → 403; missing headers → 401; POST to\
  \ the endpoint → 405; unknown `/api/` path → JSON 404 | `behavioral` | HTTP-level\
  \ test suite against the live app with seeded keys covering the full matrix; assert\
  \ status codes, the uniform 401 message, and JSON error bodies | Running the request-matrix\
  \ suite costs minutes of execution time — a bounded delay that surfaces an auth-bypass\
  \ or status-code defect before it reaches consumers. Skipping this verification\
  \ means a wrongly-accepted credential class (or an HTML error page leaking framework\
  \ details) ships to production and costs 1000× more to fix. Correctness is the only\
  \ metric. |\n| SC-6 | The dump payload matches the database exactly: count equals\
  \ the live-record count, every record matches the DB row on every whitelisted field,\
  \ ordering is by ascending id, and no excluded column appears | `behavioral` | Script:\
  \ query the DB for live records; fetch the endpoint with a valid pair; compare every\
  \ record field against the DB values and assert each record's field-key set equals\
  \ the closed whitelist | Running the full-payload comparison costs minutes of execution\
  \ time — a bounded delay that surfaces a dropped, corrupted, or over-exposed record\
  \ defect before it reaches consumers. Skipping this verification means a dump that\
  \ silently misses records or leaks excluded columns ships to production and costs\
  \ 1000× more to fix. Correctness is the only metric. |\n| SC-7 | The admin view\
  \ is admin-gated and functional: the page renders for admin and is blocked for viewer/editor;\
  \ create shows the secret exactly once; regenerate shows a new secret exactly once;\
  \ enable/disable/revoke work and the list reflects state | `behavioral` | Playwright\
  \ real-browser tests against the live app per `docs/development/ui_testing_standard.md`\
  \ with the established `SNEA_E2E=1` role-selection sessions (admin / editor / viewer);\
  \ assert gating and each lifecycle action's observable behavior | Running the role-variant\
  \ Playwright suite costs minutes of test execution time — a bounded delay that surfaces\
  \ a role-gating or credential-exposure defect before it reaches users. Skipping\
  \ this verification means a viewer reaching key management (or a secret redisplayable\
  \ after issuance) ships to production and costs 1000× more to fix. Correctness is\
  \ the only metric. |\n| SC-8 | Secrets exist only as PBKDF2 hashes at rest: after\
  \ issuing keys, a database inspection finds no plaintext secret value and finds\
  \ the versioned `pbkdf2_sha256$` hash format for every key | `behavioral` | Issue\
  \ a key with a known secret; query the `api_keys` table (full-table scan); assert\
  \ the plaintext secret appears nowhere and every `secret_hash` matches the versioned\
  \ format; verify the known secret authenticates (hash correctness) | Running the\
  \ storage-inspection check costs minutes of execution time — a bounded delay that\
  \ surfaces a plaintext-credential defect before it reaches production. Skipping\
  \ this verification means a database compromise exposes every API consumer's credentials,\
  \ which costs 1000× more to remediate. Correctness is the only metric. |\n| SC-9\
  \ | Key lifecycle and auth failures are audited: create/regenerate/enable/disable/revoke\
  \ events and every failed-auth attempt appear in `system_event_log` with the specified\
  \ event types, key identifiers, and no secret material | `behavioral` | Perform\
  \ each lifecycle operation and trigger failed auths; query `system_event_log`; assert\
  \ the event types and that no secret value appears in any event row | Running the\
  \ audit-trail verification costs minutes of execution time — a bounded delay that\
  \ surfaces a missing-audit defect before it reaches operations. Skipping this verification\
  \ means credential misuse with no forensic trail ships to production and costs 1000×\
  \ more to untangle. Correctness is the only metric. |\n| SC-10 | The per-key rate\
  \ limit holds: exceeding the window returns 429 with `Retry-After` while a second\
  \ key is unaffected; the enforced limit matches the configured value | `behavioral`\
  \ | Configure a low test limit; burst requests with one key past the window; assert\
  \ 429 + `Retry-After` and that a second key's concurrent requests still succeed\
  \ | Running the burst test costs minutes of execution time — a bounded delay that\
  \ surfaces a missing or non-per-key limiter defect before it reaches consumers.\
  \ Skipping this verification means a single consumer can starve the endpoint (or\
  \ the limiter throttles unrelated keys), which ships to production and costs 1000×\
  \ more to fix. Correctness is the only metric. |\n| SC-11 | Response encoding is\
  \ UTF-8 JSON with unescaped Unicode: `Content-Type` is `application/json; charset=utf-8`,\
  \ Unicode-bearing headwords/glosses appear as raw UTF-8 (no `\\u` escapes), and\
  \ linguistic content is byte-identical to the database | `behavioral` | Fetch the\
  \ endpoint; assert `Content-Type`; select records known to contain IPA/diacritic\
  \ characters (ə, ŋ, ã, ꝏ) and compare raw response bytes against the database values\
  \ | Running the encoding check costs seconds of execution time — a bounded delay\
  \ that surfaces a mojibake or normalization defect before it reaches consumers.\
  \ Skipping this verification means silently corrupted linguistic data ships to downstream\
  \ projects and costs 1000× more to fix. Correctness is the only metric. |\n| SC-12\
  \ | No DB exposure through the API: every error response body for every status code\
  \ contains only the generic JSON error shape — no connection strings, hosts, ports,\
  \ SQL, or stack traces | `string + behavioral` | Unit-assert every error formatter's\
  \ output against a blocklist pattern set (`postgres://`, host/port tokens, traceback\
  \ markers); live spot-checks of 401/404/429 bodies | Running the exposure checks\
  \ costs minutes of execution time — a bounded delay that surfaces an information-disclosure\
  \ defect before it reaches attackers. Skipping this verification means infrastructure\
  \ details leak to external API consumers, which costs 1000× more to remediate after\
  \ exposure. Correctness is the only metric. |\n\n## Edge Cases\n\n- **Missing headers\
  \ / unknown key / wrong secret** → uniform 401 JSON, logged as `api_auth_failure`\
  \ (no distinction revealed in the response)\n- **Disabled or revoked key** → 403\
  \ JSON, logged\n- **Unknown path under `/api/`** → JSON 404 catch-all, never the\
  \ UI's 404 page\n- **Bolt-structure change on a Streamlit upgrade** → loud error\
  \ log, API disabled, UI unaffected, no crash (SC-3)\n- **Duplicate bolt attempts**\
  \ (script reruns, second browser session, module reload) → no-op via the module\
  \ latch + structural check (SC-4)\n- **Multiple Application instances found by gc**\
  \ → every instance exposing `wildcard_router.rules` is bolted; the instance count\
  \ is logged in the self-check\n- **Empty database / zero live records** → 200 with\
  \ `{\"count\": 0, \"records\": []}`\n- **Database unavailable after the bolt** →\
  \ 503 JSON (auth lookup and record query both fail closed); the failure is logged\n\
  - **Unexpected query parameters** → ignored (dump semantics; no 400 path)\n- **Header\
  \ value edge cases** → values compared as received; no trimming; empty header values\
  \ fail as missing\n- **Soft-deleted records** → never served (the `is_deleted` filter\
  \ is part of the query, not the payload)\n- **Key revoked mid-request** → the next\
  \ request fails closed; auth decisions are not cached beyond the request\n\n## Implementation\
  \ Phases\n\n### Phase 0: Feasibility re-verification (gate)\n- RED: the bolt mechanism\
  \ is not yet re-verified in the current environment.\n- Re-run the bolt probe (artifact\
  \ pattern under `/tmp/opencode/`) against the current pinned versions: assert the\
  \ rule is prepended ahead of the catch-all and a real HTTP GET to the bolted path\
  \ is served by the same process.\n- Record the probe output as the implementation\
  \ baseline; if the mechanism no longer holds, HALT — the spec's mechanism requires\
  \ revision before any implementation.\n\n### Phase 1: API parent package + registrar\
  \ + bolt\n- Implement `src/api/` (registrar with latch + structural check + self-check\
  \ logging + failure mode; routes package; JSON-404 catch-all module; error formatters\
  \ per the Interface Contract)\n- Wire the registrar invocation into `streamlit_app.py`\
  \ after database initialization\n- Verify: SC-1, SC-2, SC-3, SC-4\n\n### Phase 2:\
  \ Key storage + admin view\n- `api_keys` model + migration; `src/services/api_key_service.py`\
  \ (create/regenerate/enable/disable/revoke, PBKDF2 hashing discipline); admin page\
  \ + navigation entry; lifecycle audit events\n- Verify: SC-7, SC-8, SC-9 (lifecycle\
  \ events)\n\n### Phase 3: Dump endpoint + scoping\n- `src/api/routes/records.py`\
  \ (closed field whitelist, live filter, resolved source/languages, id ordering);\
  \ `src/api/auth.py` (headers, constant-time verification, 401/403 semantics); method\
  \ scoping (405) and catch-all wiring; response encoding (`ensure_ascii=False`, UTF-8)\n\
  - Verify: SC-5, SC-6, SC-11, SC-12\n\n### Phase 4: Audit + hardening + tests\n-\
  \ Failed-auth logging (R-13); per-key rate limiter (R-14); full test suites — unit\
  \ tests (registrar idempotency/failure mode, hashing/storage discipline, error-formatter\
  \ exposure blocklist, rate limiter), the HTTP matrix suite, and Playwright E2E for\
  \ the admin view\n- Verify: SC-9 (auth-failure events), SC-10, and a full re-run\
  \ of all SCs\n\n## Requirements → SCs → Phases Traceability\n\n| Requirement | SCs\
  \ | Phases |\n|---|---|---|\n| R-1 (single parent API package) | SC-1 | Phase 1\
  \ |\n| R-2 (bolt mechanism) | SC-1, SC-2 | Phase 0, Phase 1 |\n| R-3 (idempotency)\
  \ | SC-4 | Phase 1 |\n| R-4 (self-check + failure mode) | SC-2, SC-3 | Phase 1 |\n\
  | R-5 (credential scheme) | SC-5 | Phase 3 |\n| R-6 (key storage/hashing) | SC-8\
  \ | Phase 2 |\n| R-7 (lifecycle + audit) | SC-9 | Phase 2 |\n| R-8 (admin view)\
  \ | SC-7 | Phase 2 |\n| R-9 (dump scope) | SC-6 | Phase 3 |\n| R-10 (response encoding)\
  \ | SC-11 | Phase 3 |\n| R-11 (error contract) | SC-12 | Phase 1, Phase 3 |\n| R-12\
  \ (method + path scoping) | SC-5 | Phase 1, Phase 3 |\n| R-13 (auth-failure logging)\
  \ | SC-9 | Phase 4 |\n| R-14 (rate limit) | SC-10 | Phase 4 |\n\n## Affected Files\n\
  \n- New: `src/api/__init__.py`, `src/api/registrar.py` (gc-find + bolt + idempotency\
  \ + self-check + failure mode), `src/api/auth.py` (header authentication, hash verification,\
  \ rate limiter)\n- New: `src/api/routes/__init__.py`, `src/api/routes/records.py`\
  \ (dump endpoint), `src/api/routes/api_not_found.py` (JSON 404 catch-all)\n- New:\
  \ `src/database/models/api_keys.py` (`ApiKeys` model); Modified: `src/database/migrations.py`\
  \ (create `api_keys` table)\n- New: `src/services/api_key_service.py` (lifecycle\
  \ operations + hashing + audit events)\n- New: `src/frontend/pages/api_keys.py`\
  \ (admin view); Modified: `src/services/navigation_service.py` (Admin section entry)\n\
  - Modified: `streamlit_app.py` (registrar invocation after database initialization)\n\
  - New: unit tests under `test/` (registrar idempotency + failure mode, hashing/storage\
  \ discipline, error-formatter exposure blocklist, rate limiter) and Playwright E2E\
  \ under `test/ui/` (admin view, `playwright_e2e` marked)\n\n## Type\n\nSPEC (new\
  \ capability: agent-facing read-only records HTTP API with admin-issued key+secret\
  \ authentication, bolted into the Streamlit server's Tornado application)\n\n##\
  \ Enforcement Gate\n\nThis spec is enforced by the project's approval gate and verification-before-completion\
  \ gates. Implementation may not begin until the spec is approved and a plan is created.\
  \ Each SC must be verified by its declared verification method before the branch\
  \ is considered complete; no SC may be skipped, weakened, deferred, or removed.\
  \ Verification evidence must be produced per the declared evidence type for each\
  \ SC.\n\n> **Enforcement gate:** All success criteria MUST pass before this spec\
  \ is considered complete. Partial implementation is not permitted.\n\n---\n\n##\
  \ Change Control\n\n| Date | Change | Reason | Authorized By |\n|------|--------|--------|---------------|\n\
