scope_summary: >
  The spec adds an agent-facing read-only HTTP API bolted into the Streamlit
  server's own Tornado application (no sidecar): a registrar gc-finds the live
  tornado.web.Application at first script run and prepends routing rules into
  wildcard_router.rules ahead of Streamlit's catch-all; GET /api/v1/records
  serves the live linguistic records as a single UTF-8 JSON dump under
  X-API-Key/X-API-Secret auth; a new api_keys table + service manage key+secret
  pairs (PBKDF2-hashed secrets, one-time display) through a new admin-gated
  admin view; key lifecycle and failed-auth events audit into the existing
  system_event_log via EventLogService; per-key fixed-window rate limiting and
  a closed JSON error contract complete the surface. 12 success criteria
  across 5 implementation phases (Phase 0 probe re-verification gate).

