testability_notes:
  - >
    All 12 SCs are testable locally; none requires external SaaS or CI-only
    infrastructure. SC-1/SC-2/SC-5/SC-6/SC-10/SC-11 need the live app on
    :8501 with the local DB re-synced per the regression protocol (the sync
    script must be the one from the feature branch under test).
  - >
    SC-7 is the only medium-rated SC: it needs real-browser Playwright runs
    with role-variant sessions and vision review of screenshots — per the UI
    testing standard, AppTest in-process checks may complement but never
    substitute.
  - >
    Seeded-key fixtures (via api_key_service, not the UI) are the shared
    prerequisite for SC-5/SC-6/SC-10/SC-11; a deterministic fixture helper is
    the highest-leverage test-infrastructure item in the plan.
  - >
    Unit-test surface is strong by design: registrar (latch, structural scan,
    failure branch), PBKDF2 hashing/storage discipline, error-formatter
    blocklist, and the rate limiter are all exercisable without a live
    server — matching the existing test/ SC-named pytest convention
    (playwright_e2e marker registered in pyproject; pythonpath=["."]).
  - >
    No EVIDENCE_TYPE_MISMATCH: every declared evidence type (behavioral, or
    string + behavioral for SC-12) matches the spec's verification-method
    column and is implementable as written.
  - >
    Timing-sensitive verification: SC-10 (window expiry) and SC-4 (two
    distinct browser sessions) need deliberate test design — a configurable
    low limit and session-isolated Playwright contexts respectively.
