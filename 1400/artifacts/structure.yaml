spec: ".issues/1400/spec.md (issues-data, revision 2026-10-02T15:15 — 13 SCs incl. SC-8a, SC-11, SC-11a)"
provenance: "generated/refreshed by writing-plans research task (2026-10-02); phase decomposition matches regenerated plan.md Phase Table (phase_count 4, items 1-13)"
sc_count: 13
phase_count: 4

# Decomposition rationale:
# Concern-boundary grouping follows concern-map.yaml and the spec Traceability
# phase column. Phase 1 = calibration (SC-1) + recall-regression (SC-8, SC-8a):
# regression assertions are measured-evidence items executed alongside the
# calibration battery against the same corpus pin. Phase 2 = seam-default
# (SC-2..SC-4) + floor-empty (SC-5..SC-7): both concerns target the same
# search_semantic() seam and commit atomically per the per-item TDD cycle.
# Phase 3 = ui-default (SC-9, SC-10): records.py threshold plumbing via
# Playwright per ui_testing_standard. Phase 4 = e2e-auth-bypass (SC-11, SC-11a):
# a distinct boundary — the app auth path (security_manager.py) and E2E harness
# — separated from Phase 3's UI-default concern (SC-11 revision, 2026-10-02).
# Phases are strictly sequential: calibration → seam → UI → E2E auth.

phases:
  - id: 1
    name: "Real-data calibration of the semantic-seam default floor"
    concern: "calibration (SC-1) + recall-regression (SC-8, SC-8a)"
    scs: ["SC-1", "SC-8", "SC-8a"]
    depends_on: []
    files:
      - "calibration module + per-anchor evidence artifact (tmp/1400/artifacts/verification-probe.yaml path recorded at calibration)"
    items:
      - item: "Item 1 (SC-1)"
        red: "Failing calibration test: per-anchor evidence artifact missing for battery anchors"
        green: "Calibration module produces provenance-recorded per-anchor artifact (in-corpus water/beaver/how many/money/gun/book; out-of-corpus 17 real queries); floor constant strictly in (0.9018, 0.9753)"
        verify: "Verify artifact provenance fields (battery, pin, date) against production replica"
        commit: "Test + artifact committed together"
      - item: "Item 8 (SC-8)"
        red: "Failing regression battery: floor-clearing anchors not at rank 1 / below floor"
        green: "Published floor serves floor-clearing anchors (water 1.0000, beaver 0.9753, money 0.9970, gun 0.9959, book 0.9936) at rank 1 with cosine >= published floor"
        verify: "Rank 1 + cosine >= floor per anchor from probe evidence"
        commit: "Test + calibration artifact committed together"
      - item: "Item 9 (SC-8a)"
        red: "Failing regression battery: 'how many' served as rank-1 hit"
        green: "'how many' (0.8917) returns below-floor empty outcome (SC-5 semantics) — documented measured behavior, not recall regression"
        verify: "Below-floor empty outcome from probe evidence"
        commit: "Test + calibration artifact committed together"

  - id: 2
    name: "Seam default-floor semantics (threshold=None) + all-below-floor outcome"
    concern: "seam-default (SC-2..SC-4) + floor-empty (SC-5..SC-7)"
    scs: ["SC-2", "SC-3", "SC-4", "SC-5", "SC-6", "SC-7"]
    depends_on: [1]
    dependency_note: "seam tests consume the calibrated floor constant (phase 1); all triplet steps for SC-2..SC-7 complete inside this phase"
    files:
      - "src/services/semantic_search_service.py"
    items:
      - item: "Item 2 (SC-2)"
        red: "Failing seam test: threshold=None does not filter by calibrated floor"
        green: "Default floor engaged in seam at threshold=None"
        verify: "Default engagement via seam test output"
        commit: "Test + seam change committed together"
      - item: "Item 3 (SC-3)"
        red: "Failing seam test: explicit threshold ignored in favor of default"
        green: "Explicit override precedence implemented"
        verify: "Override wins over default"
        commit: "Test + seam change committed together"
      - item: "Item 4 (SC-4)"
        red: "Failing seam test: None after override keeps prior explicit value"
        green: "None restores default after override"
        verify: "Override-then-None re-engages default"
        commit: "Test + seam change committed together"
      - item: "Item 5 (SC-5)"
        red: "Failing edge-input test: below-floor stub raises or serves noise"
        green: "ok + empty results + pinned deficiency message exactly 'No gloss results meet the sensitivity floor.'"
        verify: "Pinned message text exact match"
        commit: "Test + seam change committed together"
      - item: "Item 6 (SC-6)"
        red: "Failing edge-input test: zero above-floor rows raises exception"
        green: "No-exception path for all-below-floor"
        verify: "No exception across edge matrix"
        commit: "Test + seam change committed together"
      - item: "Item 7 (SC-7)"
        red: "Failing per-row filtering test: under an explicit threshold with a mixed above/below-floor stub, below-floor rows are served alongside floor-clearing rows"
        green: "Per-row filtering implemented — below-floor rows excluded from results whenever a threshold is active; floor-clearing rows still served"
        verify: "Mixed-distribution result contains ONLY floor-clearing rows (below-floor rows excluded)"
        commit: "Test + seam change committed together"

  - id: 3
    name: "UI threshold plumbing — default parity and override preservation"
    concern: "ui-default (SC-9, SC-10)"
    scs: ["SC-9", "SC-10"]
    depends_on: [2]
    files:
      - "src/frontend/pages/records.py"
    items:
      - item: "Item 10 (SC-9)"
        red: "Failing Playwright check: fresh-session semantic_threshold != published floor"
        green: "UI default synced to published floor within +/-0.01"
        verify: "Live-app Playwright screenshot evidence per ui_testing_standard"
        commit: "Test + UI change committed together"
      - item: "Item 11 (SC-10)"
        red: "Failing Playwright check: UI override silently replaced by default"
        green: "Override passthrough preserved to seam"
        verify: "Override value reaches the seam"
        commit: "Test + UI change committed together"

  - id: 4
    name: "E2E auth bypass — test-only SNEA_E2E-gated authentication"
    concern: "e2e-auth-bypass (SC-11, SC-11a)"
    scs: ["SC-11", "SC-11a"]
    depends_on: [3]
    dependency_note: "distinct boundary — app auth path (src/services/security_manager.py) and E2E harness; separated from Phase 3's UI-default concern"
    files:
      - "src/services/security_manager.py"
      - "test/ui/AGENTS.md; docs/development/ui_testing_standard.md (referenced standards)"
    items:
      - item: "Item 12 (SC-11)"
        red: "Failing E2E run: SNEA_E2E=1 Playwright suite cannot authenticate without headed OAuth login"
        green: "Pinned test-only auth bypass hook in src/services/security_manager.py auth resolution makes E2E tests authenticate headlessly — no headed-login step, no fabricated credentials"
        verify: "E2E suite completes authenticated with no headed-login step and no fabricated credentials"
        commit: "Test + bypass change committed together"
      - item: "Item 13 (SC-11a)"
        red: "Failing auth-path test: with SNEA_E2E unset, bypass branch is taken (or auth path diverges from production behavior)"
        green: "Bypass hook inert when SNEA_E2E is unset — auth resolution follows production path"
        verify: "Pytest auth-path test: with SNEA_E2E unset the auth path behaves identically to production"
        commit: "Test + bypass change committed together"

# Dependency DAG (phase → phase): 1 → 2 → 3 → 4 (strict chain; no cycles)
dependency_dag:
  - phase: 1
    depends_on: []
  - phase: 2
    depends_on: [1]
  - phase: 3
    depends_on: [2]
  - phase: 4
    depends_on: [3]

verifications:
  triplet_colocation: "PASS — for every SC, RED/GREEN/COMMIT steps all assigned to the same phase (SC-1,SC-8,SC-8a→P1; SC-2..SC-7→P2; SC-9,SC-10→P3; SC-11,SC-11a→P4)"
  cross_phase_dependency: "PASS — every RED test depends only on same-phase or earlier-phase outputs; no backward edges"

# Skill+task selection per implementation-workflow reference card:
# Each item's per-task cycle = red → green → (post-regression) → verify → commit-inline.
preflight_steps:
  pre-regression: {skill: test-driven-development, dispatch: "task(..., prompt: \"execute phase-0 task from test-driven-development\")"}
  pre-regression-verify: {skill: verification-before-completion, dispatch: "task(..., prompt: \"execute verify task from verification-before-completion\")"}

skill_task_selection:
  red: {skill: test-driven-development, dispatch: "task(..., prompt: \"execute red task from test-driven-development\")"}
  green: {skill: test-driven-development, dispatch: "task(..., prompt: \"execute green task from test-driven-development\")"}
  post-regression: {skill: test-driven-development, dispatch: "task(..., prompt: \"execute phase-4 task from test-driven-development\")"}
  verify: {skill: verification-before-completion, dispatch: "task(..., prompt: \"execute verify task from verification-before-completion\")"}
  commit-inline: {skill: "(orchestrator)", dispatch: "orchestrator runs git add <files> && git commit directly — no sub-agent dispatch"}

post_phase_steps:
  audit: {skill: audit, dispatch: "task(..., prompt: \"execute verification-audit DiMo investigator from audit. Read `audit/tasks/verification-audit-investigator.md` first\") — followed by validator, evaluator, arbiter in sequence"}
  z3-check: {skill: "(orchestrator)", dispatch: ".opencode/tools/solve check --state-path ... --contract-path ..."}
  structural-checks: {skill: finishing-a-development-branch, dispatch: "task(..., prompt: \"execute checklist task from finishing-a-development-branch\")"}
  pre-pr-gate: {skill: verification-before-completion, dispatch: "task(..., prompt: \"execute verify task from verification-before-completion\")"}
  regression-check: {skill: test-driven-development, dispatch: "task(..., prompt: \"execute phase-4 task from test-driven-development\")"}
  review-prep: {skill: git-workflow-pr, dispatch: "task(..., prompt: \"execute review-prep from git-workflow-pr. Read `git-workflow-pr/tasks/review-prep.md` first\")"}
  create-pr: {skill: git-workflow-pr, dispatch: "task(..., prompt: \"execute create task from git-workflow-pr\")"}
  exec-summary: {skill: completion-core, dispatch: "task(..., prompt: \"execute completion task from completion-core\")"}
