# Interface Compatibility — Issue #1400
issue: 1400
refreshed: "Covers SC-11/SC-11a additions (security_manager.py auth path) which postdate the original artifact."

interfaces:
  - name: search_semantic(mode, query, threshold=None, source_id=None, limit=None)
    file: src/services/semantic_search_service.py
    status: modified        # behavior of threshold=None only
    change: "threshold=None resolves to the calibrated default floor; explicit float filters at that value (special-case: an explicitly passed default-floor value keeps override semantics)"
    compatibility: backward_compatible_scorewise   # signature unchanged; result shape unchanged
    notes: "'explicit threshold=None restores the default' (SC-2) is the same value as the signature default — both resolve to the calibrated default; no sentinel needed."

  - name: SemanticSearchResult(results, status, message)
    file: src/services/semantic_search_service.py
    status: unchanged
    change: none
    compatibility: backward_compatible

  - name: status_values vocabulary ok|empty_query|no_embeddings|stale_model
    file: src/services/semantic_search_service.py (line 35)
    status: unchanged       # R-3 signature-unchanged constraint
    change: none
    compatibility: backward_compatible

  - name: records.py threshold UI state + PreferenceService 'semantic_threshold'
    file: src/frontend/pages/records.py
    status: modified        # default value only
    change: "0.80 fallback -> calibrated floor constant; slider/number widget range may need upper-bound re-check if floor exceeds 0.80"
    compatibility: internal_only    # persisted user preferences preserved

  - name: security_manager auth resolution (SC-11/SC-11a)
    file: src/services/security_manager.py
    status: modified        # test-only branch added; production path unchanged
    change: "adds an SNEA_E2E-gated test-only auth bypass branch at the auth-resolution entry point; when SNEA_E2E is unset the resolution follows the production path byte-for-byte (SC-11a verified by pytest auth-path test)"
    compatibility: backward_compatible    # production behavior identical with SNEA_E2E unset; no signature change
    notes: "bypass is the single pinned test-only mechanism; it cannot be reached by callers who do not set SNEA_E2E=1, and it does not fabricate real GitHub credentials"

breaking_changes: []        # none — consumers see same statuses/shape; only ranking floor changes
removed_interfaces: []       # none

dependency_contract:
  - source: semantic_search_service.search_semantic seam contract
    target: records.py semantic call sites + PreferenceService default string
    type: artifact schema
    constraint: "calibration evidence artifact publishes the default-floor constant; both seam and UI import it from one source of truth (R-2) — UI must not recompute or hardcode"
  - source: calibration evidence artifact (per-anchor floors + provenance)
    target: pytest calibration module + recall-regression battery
    type: artifact schema
    constraint: "artifact schema must be stable enough for the regression battery to re-derive/re-assert anchors; provenance fields mandatory (R-1)"
  - source: security_manager auth resolution contract
    target: test/ui Playwright E2E suite + SC-11a pytest auth-path test
    type: runtime env gate
    constraint: "E2E tests depend on SNEA_E2E=1 enabling the bypass; production app runs MUST NOT set SNEA_E2E — SC-11a pins inertness so the contract is one-directional (test env -> bypass only)"
