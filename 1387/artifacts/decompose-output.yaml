# Decompose output — issue 1387
# One item per SC; each item references exactly one SC-ID; sequential numbering in dependency order.
# SCs are candidate-level (spec body pending full generation); structure mirrors #1385's 7-SC UI decomposition
# parameterized by the #1386 term-space seam, plus the per-row-metadata + mode-dispatch surface unique to term space.
decomposition:
  issue: 1387
  method: "per-SC implementation items, single independently-verifiable claim each; dependency-ordered"
  sc_ids: ["SC-1", "SC-2", "SC-3", "SC-4", "SC-5", "SC-6", "SC-7"]
  sc_candidates:
    - id: SC-1
      claim: "Records-page mode radio renders the two new term-space mode entries (with captions) while the existing four entries and captions remain unchanged"
      item_ref: ITEM-1
    - id: SC-2
      claim: "Threshold control (coupled slider+numeric) persists via PreferenceService under records/<term-threshold-key> with a provisional default; invalid edits snap back"
      item_ref: ITEM-2
    - id: SC-3
      claim: "Term-space mode selection invokes the search_terms seam (not search_records, no SearchMode widening) and renders records with per-row term metadata + descending scores"
      item_ref: ITEM-3
    - id: SC-4
      claim: "Exact-match modes and #1385's gloss-space modes display no scores and are behaviorally unchanged after term-mode addition (regression guard)"
      item_ref: ITEM-4
    - id: SC-5
      claim: "Pagination slices the full ranked term list rank-once; page navigation never re-invokes the seam and never reorders"
      item_ref: ITEM-5
    - id: SC-6
      claim: "Each seam status (empty_query, no_embeddings, stale_model, zero-below-threshold) renders its designated clean empty state; stale/no-embeddings copy names the Term-space Backfill remedy"
      item_ref: ITEM-6
    - id: SC-7
      claim: "Term-mode result rows display Unicode term text byte-exact (IPA/diacritics/ꝏ/∞) with entry_type/language_code/source labels rendered"
      item_ref: ITEM-7
  items:
    - id: ITEM-1
      sc: SC-1
      red: "Playwright/AppTest asserts radio lacks the two term-space entries while 4 existing entries present"
      green: "Extend mode list + SEARCH_MODE_CAPTIONS in records.py; keep session_state keys"
      verify: "Playwright radio options + captions; existing options unchanged"
      commit: "records.py mode list + captions only"
    - id: ITEM-2
      sc: SC-2
      red: "Test asserts no threshold control exists in term modes"
      green: "Coupled slider+numeric; persist via PreferenceService (records/<key>, provisional default 0.80 pending #1386 SC-6 calibration); snap-back on invalid edit"
      verify: "pytest/Playwright persistence round-trip + widget coupling + snap-back"
      commit: "records.py threshold control"
    - id: ITEM-3
      sc: SC-3
      red: "Test asserts term-mode selection still routes through search_records (ValueError path or 0 results)"
      green: "Term-mode dispatch branch: invoke search_terms seam (import-guarded, contract-shaped mock until #1386 lands); map TermSearchResult rows to records"
      verify: "pytest dispatch branch + row mapping field-exact"
      commit: "records.py term-mode dispatch + seam binding"
    - id: ITEM-4
      sc: SC-4
      red: "Behavioral harness asserts existing modes' results/captions regress after additions"
      green: "Guard dispatch so term branch is strictly additive; existing modes untouched"
      verify: "Playwright harness per test_search_mode_ui_red.py precedent"
      commit: "dispatch wiring + regression test"
    - id: ITEM-5
      sc: SC-5
      red: "Test asserts page nav re-invokes seam or reorders ranked term list"
      green: "Rank-once slice of full ranked list via current_page/page_size"
      verify: "Playwright order-stability + invocation-count"
      commit: "records.py term pagination slicing"
    - id: ITEM-6
      sc: SC-6
      red: "Test asserts statuses crash page or render wrong copy"
      green: "Status→empty-state mapping; stale_model/no_embeddings copy names Table Maintenance → Data Reprocessing → Term-space Backfill"
      verify: "Playwright/mock-payload per-status assertions"
      commit: "records.py empty-state branch"
    - id: ITEM-7
      sc: SC-7
      red: "Test asserting Unicode mangling or missing metadata in term-row rendering"
      green: "Render term + entry_type + language_code + score desc; Unicode byte-exact display"
      verify: "pytest Unicode round-trip on rendered structure"
      commit: "records.py term-row rendering"
  dependency_order: "ITEM-1 → ITEM-2 → ITEM-3 → ITEM-4 → ITEM-5 → ITEM-6 → ITEM-7 (acyclic; ITEM-4 depends on ITEM-3's dispatch branch; ITEM-5/6/7 on ITEM-3's term-mode result state)"
  atomicity_check: "every SC maps to exactly one item; one concern per item (radio / threshold / dispatch / regression / pagination / empty-state / unicode rendering)"