      target: "src/services/preference_service.py get_preference/set_preference"
      sc: "SC-2"
      type_constraint: "get_preference('records', 'semantic_threshold', default 0.80) → str; set_preference('records', 'semantic_threshold', str(value: float in [0.0, 1.0]))"
      reason: "per-user threshold persistence round-trip (R-2)"
    - source: "src/frontend/pages/records.py (semantic dispatch)"
      target: "search_semantic seam via search_records widened SearchMode (src/services/linguistic_service.py; backend owned by #36)"
      sc: "SC-4, SC-5, SC-7"
      type_constraint: "consumes SemanticSearchResult: results list[(record_id, float score)], status str ∈ {ok, empty_query, no_embeddings, stale_model}, message str"
      reason: "semantic search reachability + display data"
    - source: "records.py empty-state copy (SC-6)"
      target: "table_maintenance.py Data Reprocessing → Embedding Backfill path (naming reference only)"
      sc: "SC-6"
      type_constraint: "message text names 'Table Maintenance → Data Reprocessing → Embedding Backfill' — no code dependency"
      reason: "stale_model / no_embeddings remedy guidance"
  cross_spec:
    consumer: "#1385 (this spec)"
