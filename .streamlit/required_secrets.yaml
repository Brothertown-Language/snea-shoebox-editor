# Required-secrets manifest — single source of truth (issue #1397, SC-1).
# Dotted key paths only. NEVER list secret values in this file.
# Consumers: startup guard and preflight verification must read this list;
# adding a required secret means adding its path here and mirroring it in
# .streamlit/secrets.toml.production (and the deployed stores).
required_secrets:
  - runtime.mode
  - github_oauth.client_id
  - github_oauth.client_secret
  - github_oauth.authorize_url
  - github_oauth.token_url
  - github_oauth.user_info_url
  - github_oauth.redirect_uri
  - contact.maintainer_label
  - contact.mastodon_url
  - connections.postgresql.url
  - aiven.project_name
  - aiven.service_name
  - aiven.api_token
