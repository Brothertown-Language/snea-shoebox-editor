  - "Pin/status degradation pattern from sibling #36: embedding_model pin per row; rows searchable only when embedding_model == pin; statuses {ok, empty_query, no_embeddings, stale_model}"
  - "Wide-table pattern decision from #36: one-table-per-search-concern (gloss_search_entries, semantic_search_entries for glosses) — this spec's term table follows SemanticTermEntry style per stub"
