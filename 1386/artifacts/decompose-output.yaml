issue: 1386
decomposed_at: "2026-09-29"
principle: "Each unit = single independently verifiable claim, one SC mapping, own RED/GREEN/verify/commit cycle. SC-IDs are assigned by the create step; items below are pre-numbered in dependency order with the SC they map to noted as the stub-order basis."

units:
  - item: ITEM-1
    sc_basis: "substrate: e5-small fine-tune artifacts (model/weights + tokenizer + allowlist config) committed and integrity-pinned"
    interface:
      inputs: "base model identifier (multilingual-e5-small), fine-tune corpus (real-source), tokenizer allowlist (IPA + project diacritics + ꝏ + ∞; syllabics excluded v1)"
      outputs: "committed model artifacts under models/, sha256 manifest, allowlist config key (config-driven, not hardcoded)"
      invariants: "artifacts byte-identical to manifest; allowlist read from config at run time; syllabics excluded"
      failure_modes: "missing artifact, hash mismatch, hardcoded allowlist detected"
    red_green:
      RED: "hash+manifest check fails on absent/mismatched artifacts; hardcoded-allowlist check fails"
      GREEN: "commit artifacts + config key"
      verify: "hash check exit 0; config read returns allowlist"
      commit: "models/ + allowlist config"
    sc_draft: SC-1-equivalent (integrity of committed substrate)

  - item: ITEM-2
    sc_basis: "term-space embedding service encode/load invariants (e5 path) — process-wide singleton shared pattern per #36 R-2/R-14; 'query:'/'passage:' e5 prefixes"
    interface:
      inputs: "list[str] vernacular terms (batch ≤ 64)"
      outputs: "float32 (1, dim(e5-small: 384)) unit-norm vectors"
      invariants: "unit L2 norm; deterministic; batch padding path; e5 prefix handling (query:/passage:); no streamlit import"
      failure_modes: "shape mismatch, non-unit norm, per-session load, OOM > envelope"
    red_green:
      RED: "pytest asserts encode term-encode path absent/wrong invariants"
      GREEN: "term-side encode extension with e5 prefixes + unit norm + batch-64"
      verify: "pytest unit: shape, norm 1.0, batch-64 padding, prefix behavior"
      commit: "embedding service term mode + test"
    sc_draft: SC-2-equivalent
    note: "depends on ITEM-1 artifacts; if #36 delivers the shared embedding_service first, this extends it"

  - item: ITEM-3
    sc_basis: "pgvector schema: new term-space table (record_id FK, entry_type term|phrase, term, embedding, embedding_model, language_code, language_family) additive-only"
    interface:
      inputs: "migration DDL"
      outputs: "wide table per SemanticTermEntry style"
      invariants: "existing tables/columns untouched; CHECK constraint on entry_type; enum-like language_code with 'unknown'; pin column not null-eligible per row semantics (mirrors #36: NULL/stale excluded at query)"
      failure_modes: "column drift, table rename, missing FK"
    red_green:
      RED: "schema introspection asserting table absent → fails"
      GREEN: "model + migration: create table; additive only"
      verify: "introspection after migration on synced DB"
      commit: "models/search.py + migrations.py entry for table"
    sc_draft: SC-3-equivalent

  - item: ITEM-4
    sc_basis: "language_code derivation + entry_type classification during term-space backfill/ingestion"
    interface:
      inputs: "parsed record fields (lg list, so-derived codes, lx/va/se/cf/ve terms, xv/phrase candidates)"
      outputs: "per-entry language_code ∈ {xnt,xpq,wam,mjy,…,unknown}; entry_type ∈ {term,phrase}"
      invariants: "codes only from a config-declared set; 'unknown' explicit; derivation traceable to \so scan; phrase rule deterministic (multi-token or \xv source)"
      failure_modes: "misassignment, silent 'unknown' abuse — mitigated by explicit enum + calibration per language"
    red_green:
      RED: "pytest asserting derivation absent/misassigns seeded samples"
      GREEN: "derivation logic in term-space population path"
      verify: "pytest on records spanning all codes + no-code records → unknown"
      commit: "derivation + test"
    sc_draft: SC-4-equivalent

  - item: ITEM-5
    sc_basis: "seam contract search_terms(query, threshold=None, source_id=None, limit=None) → TermSearchResult per stub"
    interface:
      inputs: "query (vernacular form), optional threshold/source_id/limit"
      outputs: "results list[(record_id, score, entry_type, language_code, source_id, term)], status ∈ {ok, empty_query, no_embeddings, stale_model}, message"
      invariants: "rank desc cosine, deterministic tie-break; pin join excludes NULL/stale; threshold default per calibration; no streamlit import"
      failure_modes: "rank instability, pin mismatch silent serve (must surface stale_model)"
    red_green:
      RED: "pytest asserting seam absent/wrong statuses"
      GREEN: "semantic term search service: encode query → cosine over term table (pin join) → threshold → ranked list"
      verify: "pytest service-layer vs freshly synced DB; field list exact"
      commit: "term search service + test"
    sc_draft: SC-5-equivalent

  - item: ITEM-6
    sc_basis: "calibration anchors spanning ≥3 coded languages — independent term and phrase floors"
    interface:
      inputs: "anchor set (spike-proposed: real corpus term↔term adjacency pairs, ≥3 languages)"
      outputs: "per-anchor floor evidence artifact; default threshold decision"
      invariants: "anchors real-data derived (no synthetic); floors per language and per entry_type; re-baseline procedure owns drift"
      failure_modes: "floor violation on fresh sync → FAIL (drift surfaced)"
    red_green:
      RED: "calibration pytest against unimplemented floors fails"
      GREEN: "calibration module + measured floors on synced DB"
      verify: "pytest produces per-anchor evidence artifact"
      commit: "calibration + evidence"
    sc_draft: SC-6-equivalent

  - item: ITEM-7
    sc_basis: "degraded status semantics matrix (empty_query, no_embeddings, stale_model, below-threshold ok/empty) never raising"
    interface:
      inputs: "edge query/DB states"
      outputs: "status+message payloads; messages name admin backfill remedy (Term-space Backfill)"
      invariants: "no exception escapes; empty/whitespace guard before model invocation; pin join for staleness"
      failure_modes: "exception leak, wrong status mapping"
    red_green:
      RED: "pytest asserting exceptions on edge inputs"
      GREEN: "guard chain in seam service"
      verify: "pytest edge matrix"
      commit: "edge handling + test"
    sc_draft: SC-7-equivalent

  - item: ITEM-8
    sc_basis: "inline term-space population in ingestion + admin backfill button as sibling in Data Reprocessing"
    interface:
      inputs: "record_ids (upload path); button click (admin path)"
      outputs: "rows in term table with embedding+pin; re-embed on pin change; progress reporting idiom"
      invariants: "populate/populate path batches ≤512; tqdm; fail-fast no silent skip; admin-only role gate:126-131; st.progress+callback+st.status"
      failure_modes: "partial backfill (must be transactional per batch with report), non-admin invocation rejected"
    red_green:
      RED: "extend search-entry population tests asserting no term rows; Playwright asserts no button"
      GREEN: "extend ingestion path + add Term-space Backfill sibling button + service method"
      verify: "pytest on synced records; Playwright click-through role-gated"
      commit: "upload_service + table_maintenance + tests"
    sc_draft: SC-8/SC-9-equivalent
    note: "split into two items if SC table grows >1 per item at create — stub bundles them under one scope bullet"

  - item: ITEM-9
    sc_basis: "re-train trigger on corpus+allowlist change with per-training-run manifest"
    interface:
      inputs: "allowlist config diff, corpus diff"
      outputs: "manifest recording run inputs (model id, allowlist snapshot, corpus provenance, timestamps); trigger condition detection"
      invariants: "manifest present before backfill proceeds; allowlist change ⇒ re-train required"
      failure_modes: "stale manifest, missing inputs"
    red_green:
      RED: "test asserting manifest absent/no trigger"
      GREEN: "manifest writer + trigger check in train/backfill path"
      verify: "pytest manifest round-trip + trigger assertions"
      commit: "manifest + trigger + test"
    sc_draft: SC-10-equivalent

dependency_ordering:
  chain: "ITEM-1 → ITEM-2 → (ITEM-3 ∥ ITEM-6-anchor-provisioning) → ITEM-4 → ITEM-5 → ITEM-6 (floors, needs populated synced data) → ITEM-7 → ITEM-8 → ITEM-9"
  acyclic: true
  parallel_safe_pairs: ["ITEM-3 with ITEM-2 (model vs DDL surfaces disjoint)"]

pipeline_readiness_precheck:
  atomicity: "each item one SC; verified — no item spans two SCs except ITEM-8 (flagged for create to split if the SC table yields two)"
  dag_acyclic: true
  single_concern: "each item one file-category and one verification domain (pytest vs Playwright separated: ITEM-8 contains both — create should assign the Playwright half its own item when SC-IDs are authored)"
  three_tier: "specs in this repo structure as pre (substrate/artifacts) → per-surface (schema, service, ingestion, UI-adjacent) → post (calibration/envelope/manifest) — ITEM-1/2 pre; 3-8 per; 6,9 post-flavored; plan step finalizes"