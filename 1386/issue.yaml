body: '# [SPEC] Algonquian term-space semantic search (backend/db)


  > **Full spec and artifacts: [`https://github.com/Brothertown-Language/snea-shoebox-editor/tree/issues-data/1386/`](https://github.com/Brothertown-Language/snea-shoebox-editor/tree/issues-data/1386/)**
  — this issue is a condensed exec summary; the authoritative spec lives in the `issues-data`
  branch.

  >

  > **Local artifacts:** `.issues/1386/` — analytical artifacts, sc-summary, plan,
  audit findings


  ## Problem


  Algonquian (SNEA) vernacular terms, phrases, and their orthographic variants (evidence:
  Sachim/Sachimo/Sachem/Sagimore/Sótchĭm/Sogmŏ across 4 sources) are unreachable through
  the existing search surface — #36''s semantic entry indexes the English-gloss space
  only, and exact-text FTS misses variants. BLUF: the vernacular term space has no
  embedding substrate, so vernacular-form search falls back to exact-text FTS and
  misses morphological/orthographic variants across sources. This is the second consumer
  of the substrate pattern #36 measured/spike-established (memory envelope measured
  2026-09-29; #36''s shared embedding-service substrate items remain open/pending).


  ## Scope


  - Fine-tuned `multilingual-e5-small` embedding substrate for the Algonquian vernacular
  term space, committed as SHA256-pinned INT8 ONNX + tokenizer artifacts (pin-integrity
  SC-1), with a config-driven tokenizer allowlist consumed at run time by the tokenization
  path — no hardcoded character literals in tokenization code (behavioral SC-11):
  full IPA + project diacritics + ꝏ (U+A76F) + ∞ (U+221E) in v1; syllabics deferred
  with a documented evidence trigger.

  - One wide derived-index table (SemanticTermEntry style): record_id FK, entry_type
  {term|phrase}, term, embedding vector(384), embedding_model pin, language_code derived
  from the \so scan (xnt|xpq|wam|mjy|…|unknown), language_family constant ''Algonquian''
  — shipped via DDL-only append-only migrations. Derived-index-only: primary data
  never mutated.

  - Seam contract `search_terms(query, threshold=None, source_id=None, limit=None)`
  → `TermSearchResult{results: list[(record_id, score, entry_type, language_code,
  source_id, term)], status ∈ {ok, empty_query, no_embeddings, stale_model}, message}`
  as a standalone service module (no SearchMode widening in this spec).

  - Calibration anchors from real, provenance-recorded corpus term↔term adjacency
  data spanning ≥3 coded languages, with independently recorded per-anchor term and
  phrase floors (#36''s gte-small floors are NOT transferable — e5 anchors measured
  fresh); re-train triggered by corpus + allowlist change with a per-training-run
  manifest.

  - Admin Term-space Backfill as a sibling button in Table Maintenance → Data Reprocessing.


  **Out of scope:**


  - End-user search interface UI (records page modes, threshold control, score display,
  pagination, empty states) — owned by sibling spec #1385. Binding note: #1385 as
  written binds exclusively to #36''s `search_semantic`; term-space UI consumption
  is NOT covered by it — a stakeholder-facing term-space UI would be a separately
  filed follow-up spec referencing this spec''s `search_terms` contract.

  - Mutation of primary record data (derived index only).

  - Syllabics support in v1 (deferred with trigger, not implemented).

  - Synthetic training data (prohibited outright — real source-of-record corpus only).


  ## Approach


  Fine-tuned `multilingual-e5-small` for the vernacular term space with a config-driven
  tokenizer allowlist consumed at run time; one wide SemanticTermEntry-style derived
  table with language metadata derived deterministically from the `\so` scan (explicit
  `unknown`, never NULL, never guessed); the `search_terms` seam contract as a standalone
  service module mirroring #36''s `search_semantic` pattern (no SearchMode widening);
  spike-proposed calibration anchors spanning ≥3 coded languages with independent term/phrase
  floors measured fresh (#36''s gte-small floors are NOT transferable); admin backfill
  as a sibling button in Table Maintenance → Data Reprocessing; re-training on corpus
  + allowlist change with a per-run manifest. Inline population during ingestion —
  population/derivation concern SC-8; the existing `populate_search_entries(record_ids,
  session=None) → int` signature stays unchanged (interface constraint SC-12, per the
  #36 signature-unchanged precedent). Admin control behavior SC-9; the re-click-while-in-flight
  idempotency guard is its own SC-13. SC set: SC-1..SC-13
  (13 SCs — SC-11 config-driven allowlist consumption, SC-12 signature-unchanged interface
  constraint, SC-13 re-click idempotency guard). Backend half of a two-spec split with
  frontend sibling #1385. Full spec: Intent/Not-Included/SC table/R-1–R-14/Items 1–13/Dependencies/Traceability/Cost
  Frame/Edge Cases live in the `issues-data` branch (`.issues/1386/spec.md`).


  ## Impact


  - **Risk: tokenizer allowlist gaps or hardcoding silently corrupt embeddings.**
  Mitigation: allowlist is config-driven and consumed at run time (SC-11), re-train
  is triggered by any allowlist change, and the manifest records each run''s inputs;
  committed artifacts are hash-pinned (SC-1).

  - **Risk: stale model pin served against un-refreshed vectors.** Mitigation: `embedding_model`
  pin per row + `stale_model`/`no_embeddings` statuses in the seam contract make staleness
  explicit, with pinned-only serving on mixed rows.

  - **Risk: backfill concurrency / interface regressions go unnoticed.** Mitigation:
  re-click while a run is in flight is blocked by an idempotency guard (SC-13), and
  the existing `populate_search_entries` signature is asserted unchanged after term-space
  wiring (SC-12), so gloss-space consumers cannot silently break.

  - **Risk: language_code derivation from the \so scan misassigns records.** Mitigation:
  `unknown` is an explicit enum value (never NULL, never guessed from morphology),
  and calibration anchors span ≥3 coded languages so floors are validated per language.


  Dependencies: #36''s shared embedding-service substrate + calibration/backfill/DDL
  precedents (open); #1385 frontend (no term-space binding as written — see Out of
  scope binding note); fine-tune corpus must come from real verifiable source-of-record
  materials with provenance in the manifest.


  Call to action: spec revised per validate findings (tier-1 iteration 2 — duplicate
  Item 11 block removed, compound SC-8/SC-9 split into SC-8+SC-12 and SC-9+SC-13 with
  no verification target weakened); re-validate, then plan creation.


  🤖 OpenCode (ollama-cloud/glm-5.3-flash) revised


  ---


  *Co-authored with AI: OpenCode (ollama-cloud/glm-5.3-flash)*

