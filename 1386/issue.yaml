body: '# [SPEC] Algonquian term-space semantic search (backend/db)


  > Full spec and plan artifacts: https://github.com/Brothertown-Language/snea-shoebox-editor/tree/issues-data/1386/


  ## Problem


  Records with no exact English-gloss match — vernacular terms, phrases, and variant
  spellings — are unreachable through the existing search surface: the current semantic
  search entry (#36) indexes the English-gloss space only, so a search for a SNEA
  vernacular form cannot surface a record whose gloss does not contain it. BLUF: the
  vernacular term space has no embedding substrate, so vernacular-form search falls
  back to exact-text FTS and misses morphological/orthographic variants.


  **This issue is a stub pending full spec body generation** (exec summary will be
  regenerated by the spec-creation create step after analysis). Backend half of a
  two-spec split; the parallel frontend/exec-summary sibling is #1385.


  ## Scope


  - Fine-tuned multilingual-e5-small embedding substrate for the Algonquian vernacular
  term space, with a config-driven tokenizer allowlist: full IPA + project diacritics
  + ꝏ/∞ in v1; syllabics deferred, with a documented trigger for adding them.

  - One wide table in the SemanticTermEntry style — record_id FK, entry_type {term|phrase},
  term, embedding, embedding_model pin, language_code derived from the \so scan (xnt|xpq|wam|mjy|…|unknown),
  language_family constant ''Algonquian''. Derived-index-only: primary data never
  mutated.

  - Seam contract `search_terms(query, threshold=None, source_id=None, limit=None)`
  → `TermSearchResult{results: list[(record_id, score, entry_type, language_code,
  source_id, term)], status ∈ {ok, empty_query, no_embeddings, stale_model}, message}`.

  - Spike-proposed calibration anchors spanning ≥3 coded languages, with per-anchor
  floors — term and phrase floors independent.

  - Admin backfill as a sibling button in Table Maintenance → Data Reprocessing.

  - Re-train is triggered by corpus + allowlist change, with a per-training-run manifest.


  ## Out of scope


  - End-user search interface UI (records page modes, threshold control, score display,
  pagination) — owned by the sibling spec #1385, which consumes `search_terms`.

  - Mutation of primary record data (this spec builds a derived index only).

  - Syllabics support in v1 (deferred with trigger, not implemented).


  ## Approach


  Provide the backend counterpart to #36''s English-gloss semantic search: a fine-tuned
  multilingual-e5-small model fine-tuned on meaning-adjacency with phrases down-weighted,
  a single wide derived-index table keyed on record_id with per-entry type/language
  metadata, and an embedding-model pin so stale-model states are detectable rather
  than silent (surfaced via the `stale_model` / `no_embeddings` statuses). Calibration
  uses spike-proposed anchors spanning ≥3 coded languages with independent term and
  phrase floors. Re-train is corpus+allowlist-change-driven with a per-training-run
  manifest so the derived index is reproducible. Full analysis, alternatives, and
  design decisions to be produced by the spec-creation pipeline.


  ## Impact


  - **Risk: tokenizer allowlist gaps silently corrupt embeddings.** Mitigation: allowlist
  is config-driven (not hardcoded) and re-train is triggered by any allowlist change,
  with the manifest recording the run''s inputs.

  - **Risk: stale model pin served against un-refreshed vectors.** Mitigation: `embedding_model`
  pin per row + `stale_model` status in the seam contract makes staleness an explicit,
  testable state.

  - **Risk: language_code derivation from \so scan misassigns records.** Mitigation:
  `unknown` is an explicit enum value; calibration anchors span ≥3 coded languages
  so floors are validated per language.


  Dependencies: multilingual-e5-small fine-tuning substrate from #36 (English-gloss
  space, open); frontend spec #1385 binds to the `search_terms` seam contract from
  this spec.


  Call to action: analyze and draft the full spec body via the spec-creation pipeline
  (this stub will be replaced by the generated exec summary).


  🤖 OpenCode (ollama-cloud/glm-5.3-flash) created'
