# SC Summary — Issue #1401: Search-match highlighting in Records view
# 1 SC = 1 plan item = 1 RED/GREEN/verify/COMMIT cycle (per-SC decomposition)
sc_count: 23
scs:
  - id: "SC-1"
    description: "Pure stored-term span helper returns a whole-term (start, end) offset pair for every verbatim occurrence of every provided stored raw term in a rendered line, scanning deterministically left-to-right."
    evidence_type: "behavioral"
    plan_item: 1
  - id: "SC-2"
    description: "Pure stored-term span helper returns an empty span list when a provided term does not occur in the rendered line, when the term list is empty, or when the rendered line is empty."
    evidence_type: "behavioral"
    plan_item: 2
  - id: "SC-3"
    description: "Pure FTS span helper emits a whole-word span for every rendered-line word whose normalized form matches any query token, where query tokens are produced by the service normalizer with the FTS strategy's tsquery-unsafe stripping and :* prefix semantics."
    evidence_type: "behavioral"
    plan_item: 3
  - id: "SC-4"
    description: "Pure FTS span helper returns an empty span list when the query yields no tokens (including queries containing only tsquery-unsafe characters) or when no rendered-line word matches a query token."
    evidence_type: "behavioral"
    plan_item: 4
  - id: "SC-5"
    description: "Service search result container gains an additive optional matched-terms field defaulting to None such that all existing construction sites remain source-compatible."
    evidence_type: "behavioral"
    plan_item: 5
  - id: "SC-6"
    description: "Page-local mirror container carries the same optional matched-terms field such that semantic seam construction completes without raising."
    evidence_type: "behavioral"
    plan_item: 6
  - id: "SC-7"
    description: "Service search method collects the deduplicated set of matched raw term values grouped by record identifier for Lexeme, Headword, and Gloss modes within the existing paginated query pass."
