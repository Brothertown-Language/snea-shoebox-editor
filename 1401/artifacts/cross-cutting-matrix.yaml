# Cross-Cutting Matrix — Issue #1401: Search-match highlighting in Records view
grounding: handoff cross-cutting artifact + verified code reads (2026-10-02)

## matrix
- concern: Unicode/linguistic-data integrity (CRITICAL)
  applies_to: SC-1, SC-2, SC-3, SC-4, SC-7
  rule: "All matching Unicode-aware: NFD decomposition, combining-mark strip, fancy→straight quotes, ∞→oozzz, ✔→'', lowercase, leading-punctuation strip (generate_sort_lx, linguistic_service.py:107-134). Never compare ASCII-folded text; never use ASCII char classes ([a-zA-Z], [a-zA-Z0-9]) — prefer Unicode-safe \\w tokenization without re.ASCII (docs/lessons-learned/2026-06-13-regex-linguistic-characters.md). Validate against corpus samples with diacritics, IPA (ə ʃ ŋ ʔ), ∞."
- concern: Data integrity / no fabricated matches
  applies_to: SC-1, SC-2, SC-3
  rule: "Raw terms must be located verbatim; absent term → graceful no-op; never approximate with fuzzy matching (guideline 090 no-synthetic-data)."
- concern: Theming (iframe CSS isolation)
  applies_to: SC-5, SC-7
  rule: "st.html() iframe does not inherit Streamlit CSS custom properties; light/dark via prefers-color-scheme media queries (ui_utils.py:286-295) plus JS parent-frame read (:298-314); mark.search-token must define both variants."
- concern: Coexistence with existing highlighting
  applies_to: SC-4, SC-5, SC-7
  rule: "Lines can carry status-* tints and mark.diff-token spans (ui_utils.py:252-285); precedence rule defined and tested: search-token styling coexists with/within diff-token runs; diff behavior unaltered."
- concern: Performance
  applies_to: SC-1, SC-2, SC-3, SC-6
  rule: "Per rendered record O(lines × terms) substring scans; Path B normalizes candidate words per line; page limit 50 records — negligible; matched-term collection is one join-side aggregation in the existing paginated query; no new caching layer."
- concern: Accessibility/contrast
  applies_to: SC-5
  rule: "Teal/cyan tint + bold must hold WCAG-reasonable contrast against light #f0f2f6 and dark #262730 backgrounds."
- concern: UI testing standard
  applies_to: SC-5, SC-6, SC-7
  rule: "User-visible behavior requires Playwright real-browser tests (docs/development/ui_testing_standard.md); AppTest is smoke-only; E2E gated by SNEA_E2E=1 + live app on :8501; skipping is by design, never a silent PASS."

## governing_rules
- XeLaTeX/Unicode project conventions: no .tex files touched, but Unicode-first handling applies throughout (AGENTS.md linguistic-data requirements).
- Production data protection: tests never run against production data (guideline 090) — Playwright E2E uses the local live app instance.
- Linters advisory-only; no auto-modify (guideline 060).
