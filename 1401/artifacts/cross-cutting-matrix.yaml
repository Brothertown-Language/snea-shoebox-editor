# Cross-cutting-matrix artifact for issue 1401 (backfilled from spec)
artifact: cross-cutting-matrix
issue: 1401
status: complete
spanning_scs:
  - sc: SC-3
    concerns: [pure-span-computation, service-data-layer]
    why: span helper is pure (Phase 1) but depends on the service normalizer (generate_sort_lx) and FTS strategy token-cleaning semantics — presentation code importing a service-layer dependency (R-11).
  - sc: SC-9
    concerns: [renderer-and-styling, page-wiring]
    why: default-off parameters must keep ALL existing call sites byte-identical, including call sites outside the Records page (revision history, import diff).
  - sc: SC-12
    concerns: [renderer-and-styling, diagnostics]
    why: search-token rendering must compose with the existing diff-token diagnostics path without altering it (R-16 precedence rule).
  - sc: SC-17
    concerns: [page-wiring, renderer-and-styling]
    why: threading happens on the Records page but its correctness criterion is that non-View-mode renderer call sites receive no highlight parameters.
  - sc: SC-5 / SC-6
    concerns: [service-data-layer, page-wiring]
    why: the semantic seam contract spans the service result container and the page-local mirror container — both must gain the field consistently or construction raises.
cross_cutting_constraints:
  - R-11 single-normalizer rule: only generate_sort_lx may normalize; no second implementation anywhere.
  - R-14 Unicode-awareness: no ASCII-only character classes anywhere in matching/tokenization (lessons-learned mandate).
  - R-15 read-path only: no schema/migration/endpoint/parser changes across any concern.
  - R-18 bounded computation: span computation linear in lines x terms over the paginated window; collection join-side; no new caching.
  - R-19 evidence regime: Playwright real-browser for user-visible claims; AppTest smoke-only; E2E gated by SNEA_E2E=1 + live app :8501.
