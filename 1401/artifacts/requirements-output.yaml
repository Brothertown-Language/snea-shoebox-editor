# Requirements Contract — Issue #1401: Search-match highlighting in Records view
source: issue title + brainstorming handoff (design_approved: true, tmp/issue-1401/artifacts/preliminary/)
verification: every requirement checked against live code (bounded reads, 2026-10-02)

## Explicit requirements (stated directly in handoff/developer decisions)
- R1: Search matches are visually highlighted in the rendered MDF block in Records View mode (issue title; handoff key findings).
  Verified: `render_mdf_block` at records.py:912 renders View mode; `search_token` mark mechanism mirrors existing `diff-token` spans (ui_utils.py:206-219).
- R2: Whole-term granularity — any term containing a match highlights in full, not sub-word spans (developer decision).
  Verified: raw terms stored verbatim (upload_service.py:1795-1837); substring find of the whole term string is the natural unit.
- R3: Highlighting applies to Lexeme/Headword/Gloss/FTS modes; Semantic Gloss/Semantic All are excluded (similarity scores remain their feedback surface).
  Verified: mode dispatch `_search_strategies` (linguistic_service.py:80-87); semantic seam renders scores (records.py:217-302).
- R4: Style: `mark.search-token` teal/cyan tint + bold, visually distinct from yellow `diff-token` and status tints; light and dark theme variants both defined.
  Verified: `diff-token` CSS (ui_utils.py:280-285); theme handled via `prefers-color-scheme` media queries (286-295) + JS parent-frame read (298-314).
- R5: No highlight when search box is empty (empty query → rendering identical to today).
  Verified: `search_term = st.session_state.search_query or None` (records.py:194); no-query path exists.
- R6: ILIKE modes (Lexeme/Headword/Gloss): locate the matched stored raw terms verbatim in rendered text via plain substring find.
  Verified: raw `term` populated verbatim from parsed fields (upload_service.py:1795-1837); `format_mdf_record` preserves field content (parser.py:224-243), so raw terms appear verbatim in rendered lines.
- R7: FTS mode: normalize the query tokens the same way as `_search_fts`, then Unicode-aware normalized scan of raw rendered lines; prefix semantics for `:*`; multi-token AND.
  Verified: `_search_fts` pipeline (linguistic_service.py:40-55); `fts_entries` stores only the tsvector of fully-normalized text (upload_service.py:1839-1843, search.py:11-25) — no raw/positioned document, so `ts_headline` is not viable; query tokens are known client-side from the query string.
- R8: Graceful no-op: a term absent from rendered text yields no span (never fuzzy-approximate; data drift degrades to no highlight).
  Verified: consistent with data-integrity guideline 090 (no fabricated matches).

