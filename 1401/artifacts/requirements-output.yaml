- R10: `render_mdf_block` gains optional keyword params (highlight terms/query/mode), default-off; the three other call sites (records.py:1022 revision history; upload_mdf.py diff views) remain untouched without edits.
  Verified: signature (ui_utils.py:186); call sites (records.py:912, records.py:1022; upload_mdf.py per handoff — 2 call sites).
- R11: Matched-term collection happens inside `search_records()` (post-dispatch or same query pass) so all ILIKE modes share one implementation; semantic strategies untouched.
  Verified: dispatch point at linguistic_service.py:453-457; `search_records` returns at 487.
