- R15: UI-visible behavior is verified with Playwright real-browser tests per the UI testing standard; AppTest is smoke-only; E2E gated by `SNEA_E2E=1` + live app on :8501.
  Verified: repository UI testing standard (docs/development/ui_testing_standard.md) is mandatory per AGENTS.md.

## Constraint requirements (boundary conditions)
- C1: Unicode-aware matching throughout — NFD diacritics, IPA (ə ʃ ŋ ʔ), ∞ (U+221E), fancy quotes; never ASCII char classes (`[a-zA-Z]`, `[a-zA-Z0-9]`); prefer Unicode-safe `\w` tokenization without `re.ASCII` (docs/lessons-learned/2026-06-13-regex-linguistic-characters.md).
- C2: ∞ is a valid letter mapped to `oozzz` (docs/lessons-learned/2026-06-13-infinity-symbol-normalization.md) — FTS scan must treat ∞-containing candidate words consistently with `generate_sort_lx`.
- C3: No DB schema change, no migration, no new endpoints; search tables already carry raw `term` (search.py:39-41, 58-59, 76-77); `fts_entries` untouched.
- C4: No changes to MDF parsing or DB write paths — read-path only (format_mdf_record, upload_service population paths untouched).
- C5: Search-token marks must not alter diff behavior — coexistence/precedence with `status-*` tints and `mark.diff-token` spans must be defined.
- C6: Contrast must hold on both block backgrounds (light `#f0f2f6`, dark `#262730`) at WCAG-reasonable levels.
- C7: Performance bounded: per rendered record O(lines × terms) scans; matched-term collection is a join-side aggregation within the same paginated query window (page size 50). No new caching layer.
- C8: XeLaTeX/Unicode project conventions do not directly apply (no .tex files touched), but Unicode-first handling does.

## Non-requirements (explicitly excluded)
- N1: No highlighting in Semantic modes (similarity scores already shown).
- N2: No highlighting in Edit mode — Streamlit textarea cannot render rich markup.
- N3: No highlighting in Revision History or import diff views (default-off params leave those call sites untouched).
- N4: No sub-word/partial-term highlight spans (whole-term only, developer decision).
- N5: No new preference toggle in current design (highlight activates automatically when a lexical-mode query is present).
- N6: No fuzzy matching or similarity-based approximate matching for term location.
- N7: No schema changes, no new session-state keys, no caching of highlight spans.
- N8: No `ts_headline` usage (not viable against stored data).

