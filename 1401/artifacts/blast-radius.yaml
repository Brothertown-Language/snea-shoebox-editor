- component: src/services/linguistic_service.py
  change: `RecordSearchResult` gains additive optional field `matched_terms` (default None); `search_records()` collects matched raw `term` values per record for Lexeme/Headword/Gloss modes (same query pass); strategy signatures unchanged
  risk: Low — additive query/join work; existing 4-field construction sites stay source-compatible
  verified: dataclass at :90-99; dispatch at :453-457; return at :487
- component: src/frontend/ui_utils.py
  change: `render_mdf_block` gains optional default-off highlight param(s); wraps matches in `<mark class="search-token">`; new CSS block alongside `diff-token` styles with both-theme variants
  risk: Low — additive, opt-in; escaping path preserved
  verified: signature :186; span markup :206-219; CSS :252-295
- component: src/frontend/pages/records.py
  change: View-mode render call (:912) threads highlight context; `_RecordSearchResultLike` (:11-21) gains matching optional field
  risk: Low — parameter threading + additive field with default
  verified: call :912; mirror constructed :297-302
- component: src/frontend/search_highlight.py (NEW)
  change: pure span-computation module — stored-term verbatim find (SC-1) + FTS normalized query-token scan (SC-2); reuses `generate_sort_lx` as sole normalizer
  risk: None — new code, no existing surface touched
- component: test/ and test/ui/
  change: unit tests (span helpers, service collection) + Playwright rendering/E2E tests
  risk: None — additive tests

## ripple_effects
- Service → page: `matched_terms` flows through `search_records()` result consumed by records.py View-mode loop (records loop renders `result.records`; both exact and semantic paths converge on the same render call).
- Presentation → CSS: new mark class must coexist with `status-*` line tints and `mark.diff-token` spans on the same line (precedence rule defined in SC-4).
- Theming: `st.html()` iframe does not inherit Streamlit CSS custom properties — both `prefers-color-scheme` variants required (ui_utils.py:286-295) plus JS parent-frame theme read (:298-314) unaffected.
- FTS scan dependency: new helper imports `LinguisticService.generate_sort_lx` (linguistic_service.py:107-134) — presentation module gains a service-layer import for the normalizer only; no DB access.

## not_affected
- Database schema, migrations, models — search tables already store raw `term` + `normalized_term` (search.py:39-41, 58-59, 76-77); `fts_entries` untouched (search.py:11-25)
- src/mdf/parser.py — read-only dependency; `format_mdf_record` preserves field content (:224-243)
- src/services/upload_service.py population paths (:1794-1843) — read as-is
- Semantic search service — no highlighting in Semantic modes (similarity scores remain the feedback surface)
- Edit-mode UI — Streamlit textarea cannot render rich highlighting
- records.py:1022 revision-history call and upload_mdf.py diff call sites — default-off params keep them byte-identical
- `_search_strategies` strategy function signatures — unchanged; collection implemented post-dispatch

## mirror_contract_risk
- `_RecordSearchResultLike` (records.py:11-21) mirrors the `RecordSearchResult` field contract for the #36 semantic seam (constructed at :297-302). Additive field on `RecordSearchResult` MUST be optional-with-default and mirrored (or tolerated as absent) in the page-local container — otherwise the seam construction raises TypeError on the new kwarg. Mitigation is a required part of SC-3.
