# Blast Radius — Issue #1401: Search-match highlighting in Records view
grounding: spec scope sections (brainstorm handoff artifacts) + bounded verification reads (2026-10-02)
scope_classification: ENHANCEMENT
grounding_coverage: handoff blast-radius/concern-map/code-paths artifacts consumed as primary design input; all cited surfaces verified by direct line-range reads

