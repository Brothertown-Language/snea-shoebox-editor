# Testability Assessment — Issue #1401: Search-match highlighting in Records view
grounding: handoff testability artifact + verified code reads (2026-10-02)

## per_phase_strategy
- phase: Phase 1 (SC-1 stored-term spans)
  type: unit
  detail: pure function — pytest, no Streamlit/DB. Exact raw-term find; unicode edge cases (NFD length shifts, IPA ə ʃ ŋ ʔ, ∞ U+221E, fancy quotes, leading punctuation); overlapping terms; absent term → no-op; empty terms → no-op.
- phase: Phase 1 (SC-2 FTS spans)
  type: unit
  detail: pure function — pytest. Query normalization parity with _search_fts (tsquery-unsafe strip, :* prefix, multi-token); Unicode-safe \w tokenization (no re.ASCII); ∞→oozzz consistency; candidate normalization mapping back to raw offsets; empty query → no-op.
- phase: Phase 2 (SC-3 service collection)
  type: integration (pytest, test DB fixtures)
  detail: per-record matched raw terms for Lexeme/Headword/Gloss; None for FTS/Semantic; dedup; existing 4-field constructions still work; mirror construction with new field works.
- phase: Phase 3 (SC-4 markup)
  type: mixed — unit/AppTest smoke for markup structure; Playwright DOM for rendered output
  detail: search-token wrapping correctness; escaping preserved; coexistence with diff-token spans and status tints; malformed spans clamped.
- phase: Phase 3 (SC-5 CSS)
  type: behavioral (Playwright visual)
  detail: highlight visible with teal/cyan + bold; distinct from diff-token yellow and status tints; both light and dark theme variants verified; screenshots archived.
- phase: Phase 3 (SC-6 wiring)
  type: behavioral (Playwright)
  detail: highlight appears in View mode in each lexical mode; no highlight with empty query; no highlight in Semantic modes; revision-history/diff renders unaffected.
- phase: Phase 4 (SC-7 E2E)
  type: behavioral (Playwright E2E, gated)
  detail: SNEA_E2E=1 + live app on :8501; full search-to-highlight flow; skipping is by design and never silently treated as PASS; one-time OAuth login via headed Chromium when saved auth state missing.

