# Concern Map — Issue #1401: Search-match highlighting in Records view
grounding: handoff concern-map artifact + verified code reads (2026-10-02)

## concern_boundaries
- concern: Query/data (WHICH terms matched)
  home: src/services/linguistic_service.py
  responsibility: collect matched raw `term` values per record for ILIKE modes inside `search_records()`; expose via additive `RecordSearchResult.matched_terms`; return None for FTS/Semantic
  phase: Phase 2 (SC-3)
- concern: Span computation (WHERE matches are)
  home: src/frontend/search_highlight.py (new, pure)
  responsibility: stored-term verbatim find (SC-1); FTS normalized query-token scan reusing `generate_sort_lx` (SC-2); no Streamlit/DB imports
  phase: Phase 1 (SC-1, SC-2)
- concern: Presentation markup (HOW matches render)
  home: src/frontend/ui_utils.py
  responsibility: thread highlight spans through `render_mdf_block`, emit `<mark class="search-token">` with escaping, own coexistence rule with diagnostics spans
  phase: Phase 3 (SC-4)
- concern: Styling (appearance)
  home: src/frontend/ui_utils.py CSS block
  responsibility: `mark.search-token` teal/cyan + bold, both theme variants, contrast
  phase: Phase 3 (SC-5)
- concern: Page wiring (WHEN highlighting applies)
  home: src/frontend/pages/records.py
  responsibility: compute spans per View-mode record (query present + lexical mode) and pass into the single :912 render call; no-op when query empty or mode is semantic
  phase: Phase 3 (SC-6)

## boundary_rules
- MDF parsing and DB write paths are NOT touched — read-path only (handoff boundary rule, verified: parser.py:224-243, upload_service.py:1794-1843 unmodified).
- Normalization semantics come from ONE function (`generate_sort_lx`, linguistic_service.py:107-134); the FTS scan reuses it — no second normalizer (handoff boundary rule, verified).
- The diagnostics span mechanism (`diag["spans"]` → `mark.diff-token`, ui_utils.py:206-219) is a separate presentation concern; search-token marks must not alter diff behavior.
- No changes to Semantic-mode behavior (records.py:217-302 seam untouched apart from the additive mirror field).

## separation_per_phase
- Phase 1: pure functions only — no Streamlit, no DB, no HTML (independently unit-verifiable).
- Phase 2: service layer only — dataclass + query aggregation; no UI imports.
- Phase 3: presentation + page — markup (ui_utils), CSS (ui_utils), wiring (records.py); each item targets exactly one file category and one verification domain.
- Phase 4: end-to-end verification only — no production code changes.
