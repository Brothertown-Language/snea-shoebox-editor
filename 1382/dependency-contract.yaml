  - "sc5_done == z3.If(maintenance_ready, sc5_done, False)"
  - "sc6_done == z3.If(normalized_identity_proven, sc6_done, False)"
  - "sc7_done == z3.If(fts_equivalence_proven, sc7_done, False)"
  - "sc8_done == z3.If(seed_clean, sc8_done, False)"
  - "sc9_done == z3.If(normalization_extended, sc9_done, False)"
  - "sc10_done == z3.If(scan_ready, sc10_done, False)"
  - "sc11_done == z3.If(maintenance_ready, sc11_done, False)"
  - "sc12_done == z3.If(outcome_report_produced, sc12_done, False)"
  - "sc13_done == z3.If(maintenance_ready, sc13_done, False)"

invariants:
  - "normalized_columns_stable == True"
  - "simple_tsconfig_only == True"
  - "no_auto_migration == True"
  - "locked_records_untouched == True"
  - "no_edit_history_writes == True"
  - "z3.If(sc5_done, z3.And(maintenance_ready, normalized_columns_stable), z3.BoolVal(True))"
  - "z3.If(sc7_done, z3.And(fts_equivalence_proven, simple_tsconfig_only), z3.BoolVal(True))"
  - "z3.If(sc11_done, z3.And(locked_records_untouched, no_edit_history_writes), z3.BoolVal(True))"

phase_mapping:
  phase-1: {scs: [SC-8, SC-1, SC-9], states: [seed_clean, normalization_extended], depends_on: []}
  phase-2: {scs: [SC-2, SC-10], state: scan_ready, depends_on: [phase-1]}
  phase-3: {scs: [SC-5, SC-11, SC-12, SC-13, SC-6, SC-7], states: [maintenance_ready, normalized_identity_proven, fts_equivalence_proven, outcome_report_produced], depends_on: [phase-2]}
  phase-4: {scs: [SC-3, SC-4], states: [ui_section_present, ui_flow_complete], depends_on: [phase-2, phase-3]}
  phase-5: {scs: [all], state: suite_green, depends_on: [phase-1, phase-2, phase-3, phase-4]}

dependency_contract:
  - source: LinguisticService.count_infinity_records / list_infinity_records
    target: records table (lx, mdf_data, is_deleted, is_locked columns)
    type: artifact-schema (query contract)
    constraint: filter is_deleted == False; locked defective records (is_locked == True) excluded from the remediable count and reported separately (SC-10); direct Unicode U+221E literal in LIKE/position query — no ASCII regex per docs/lessons-learned/2026-06-13-regex-linguistic-characters.md
  - source: LinguisticService.remediate_all_records
    target: UploadService.populate_search_entries(record_ids, session)
    type: interface-reuse (search-entry + FTS rebuild)
    constraint: consumed unmodified; session passed through; no new to_tsvector calls — 'simple' tsconfig only per docs/lessons-learned/2026-06-13-postgres-fts-algonquian.md
  - source: LinguisticService.remediate_all_records
    target: records table (current_version) + edit_history table
    type: non-interference (DB maintenance, not an editorial edit)
    constraint: the maintenance path writes NO EditHistory rows and performs NO current_version bumps (stakeholder-directed intent change, spec v7); record history and version state are untouched
  - source: "'∞→ꝏ Remediation' section inside render_data_reprocessing_maintenance (table_maintenance.py)"
    target: LinguisticService.count_infinity_records / list_infinity_records / remediate_all_records (plus the scan's separate locked count)
    type: interface-consumption (UI → service)
    constraint: admin-only access inherited from the main() admin guard which gates the whole Table Maintenance page (no second guard); sidebar radio list keeps exactly the original three options; remediable and locked counts displayed before any action; Apply All is a plain primary button following the established maintenance-op pattern (no confirm gate, v8); progress pattern follows the existing section; outcome report rendered on completion; handle_ui_error with logger_name snea.pages.table_maintenance
  - source: generate_sort_lx symbol_map addition
    target: all generate_sort_lx callers (populate_search_entries, search normalization, reprocessing)
    type: additive-extension
    constraint: existing "U+221E maps to oozzz" mapping preserved (SC-9); ꝏ input now normalizes to oozzz
  - source: LinguisticService.remediate_all_records
    target: Record.is_locked field + strict-immutability enforcement in `update_record()` in `src/services/linguistic_service.py` (provenance of the lock invariant)
    type: policy-conformance (locked-record non-interference)
    constraint: locked defective records are NEVER altered — excluded from the remediable scan count and reported separately (SC-10); Apply All never touches them (SC-11); the outcome report states remediated and locked unremediated counts (SC-12); locked presence does not block remediable remediation (SC-13); no lock override or forced unlocking
