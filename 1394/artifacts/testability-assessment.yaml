# Testability assessment for issue 1394
spec_path: .issues/1394/spec.md
issue: 1394

assessments:
  - sc: SC1
    claim: >
      After a fresh sync, format_type(atttypid, atttypmod) for every embedding
      column returns vector(384).
    evidence_type: behavioral
    method: >
      Run scripts/sync_prod_to_local.sh against a synced local DB, then query
      pg_attribute/pg_type (format_type) via psql on socket tmp/local_db; expect
      vector(384) for records, gloss_search_entries, semantic_search_entries.
      Existing tests test/test_semantic_search_schema_sc3.py (2 vector384 tests)
      provide executable regression evidence.
    artifact: tmp/1394/verification-evidence

  - sc: SC2
    claim: After a fresh sync, records.id (and other ORM autoincrement id
      columns) carry their nextval defaults.
    evidence_type: behavioral
    method: >
      Query pg_attrdef via pg_get_expr for records (and ORM-managed tables) after
      sync; expect nextval(...) defaults. Executable evidence: test_sc8_* tests in
      test/test_upload_search_entries.py (ORM inserts omitting id) pass after sync.

  - sc: SC3
    claim: Full test suite after sync reports 0 failures (5 baseline failures
      gone, no new failures).
    evidence_type: behavioral
    method: >
      bash scripts/sync_prod_to_local.sh && uv run pytest test/ — exit code 0 with
      failures=0. Baseline comparison: 5 failed / 169 passed / 8 skipped at trunk
      tip eb467b8 before the fix.

  - sc: SC4
    claim: TDD phase-0 pre-regression baseline passes on a synced database.
    evidence_type: behavioral
    method: >
      Executed as SC3 (the phase-0 baseline IS the full suite on a synced DB);
      verified by the same pytest run with 0 failures after fresh sync.

honesty_notes:
  - All SCs require a live local-DB sync run; structural-only evidence (file edits
    without running the sync + suite) is NOT sufficient.
  - No synthetic data: evidence comes from real production-synced local DB queries.
