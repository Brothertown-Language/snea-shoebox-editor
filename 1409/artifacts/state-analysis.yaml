        to: st.session_state._accepted_threshold
        trigger: _validate_threshold rejects non-numeric/out-of-range edit (pre-instantiation)
        scs: [SC-3a, SC-3b]
  - name: st.session_state.semantic_threshold_slider
    role: widget-bound key (st.slider)
    transitions:
      - from: absent
        to: backing value
        trigger: pre-instantiation seeding, first instantiation only (at-most-once, R-1)
        scs: [SC-1a, SC-3b]
      - from: seeded
        to: seeded
        trigger: rerun/navigation — NO re-seeding writes; widget reads existing value
