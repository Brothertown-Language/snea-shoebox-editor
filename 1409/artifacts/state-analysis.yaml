invariants:
  - Each widget-bound key is written to session state at most once per session (R-1).
  - No explicit value= kwarg on a widget whose key is pre-seeded (eliminates dual-set warning).
  - Rendered values identical to pre-change behavior across first load, rerun, navigation (R-5).
  - Invalid edits render last accepted value (R-3).

forbidden_transitions:
  - Unconditional re-sync writes of widget keys on every rerun (current defect contributor, removed).
  - value= argument overriding seeded session-state value on reruns (would break SC-3a/SC-3b).

edge_cases:
  - Non-numeric/unparseable/out-of-range saved preference → _validate_threshold restores last accepted value pre-instantiation; widget keys still not dual-set.
  - Preference deleted between page loads → next session re-seeds from CALIBRATED_FLOOR.
  - Multiple sessions independent (per-session st.session_state); no shared-state race.
