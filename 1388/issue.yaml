body: '# [SPEC-FIX] #1388 — Remediate 5 pre-existing test-harness failures surfaced
  by #36 pre-regression baseline (stale-RED tests + sys.modules mock leak)


  > **Full spec and artifacts: [`https://github.com/Brothertown-Language/snea-shoebox-editor/tree/issues-data/.issues/1388/`](https://github.com/Brothertown-Language/snea-shoebox-editor/tree/issues-data/.issues/1388/)**


  ## Problem


  The #36 pre-regression baseline (synced DB, trunk tip `08c1e93`, zero #36 changes)
  records 5 pre-existing pytest failures — all classified by live diagnosis as test-harness
  defects, zero real product regressions: 3 stale-RED tests in `test/test_search_mode_ui_red.py`
  asserting UI intentionally removed by commit `3f54ad3`, and 2 order-dependent failures
  in `test/test_migration_backfill_search_entries.py` caused by module-level `sys.modules`
  MagicMock leaks in two carrier test files. Until repaired, every #36 regression
  sweep reports these failures and masks real regressions.


  ## Scope


  - Contain the module-level `sys.modules` mock leak at source in `test/search_mode_ui_red.py`''s
  carrier script (`RECORDS_SCRIPT`) with save/restore insert-only semantics.

  - Contain the identical leak in `test/test_filter_ux_red.py` (`RECORDS_SCRIPT`).

  - Delete the 2 superseded stale-RED tests (`test_grouping_separators_render`, `test_help_text_below_radio`).

  - Rewrite `test_header_shows_mode_name_and_count` to seed `st.session_state.search_query`
  directly and assert the `"Search:"` header across all collected markdown values.

  - Suite-health gate: full-suite default-alphabetical-order run reports 52 passed,
  0 failed.


  **Out of scope:** all `src/**` product code (C-1 freeze — `migrations.py` and `records.py`
  are faultless and MUST NOT change); `test/test_migration_backfill_search_entries.py`
  (victim file heals as a verified side-effect of carrier containment); `test/ui/test_records_*.py`
  (5 files also mutate `sys.modules` — boundary flag only); conftest.py auto-cleanup
  fixture (rejected: masks, not contains); caption-rewrite of the deleted tests (developer
  chose deletion).


  ## Approach


  Test-side repair only, per baked developer dispositions. Containment uses save/restore
  insert-only semantics — entries that pre-existed in `sys.modules` are never deleted;
  only carrier-inserted entries are reverted after the carrier''s execution scope
  — which eliminates the failure mode where restoring deletes a pre-existing real
  module. The deletion pair removes tests whose assertions were intentionally superseded
  by `3f54ad3` (#1321). The header-test rewrite seeds `st.session_state.search_query`
  directly (the `text_input.set_value` propagation path was broken by `907843d`''s
  `on_change` removal) and replaces `markdown[0]` indexing (pagination markdown) with
  an ordering-independent any-of scan. Success is defined at suite level: 52 tests
  green (54 baseline minus 2 deleted; 49 previously passing plus 3 repaired) in the
  default alphabetical order — the one order in which the order-dependent defect class
  reproduces.


  ## Impact


  **Top risks and mitigations:**


  1. *Containment breaks the carriers'' own currently-passing tests* (within-execution
  service-mock resolution inside `AppTest.from_string` must survive) — mitigation:
  R-8 invariant check; restore scoped to teardown/scope-exit, not during exec.

  2. *Restore deletes a pre-existing real module* — mitigation: insert-only restore
  semantics are mandated by R-2/R-6 (revert only carrier-inserted entries).

  3. *Full-suite green claimed from isolation-only runs masks order-dependence* —
  mitigation: SC-5 mandates the default alphabetical-order reproduction mechanism,
  with the database pre-synced per the repo''s Regression Test Protocol (`bash scripts/sync_prod_to_local.sh`).


  **Key dependencies:** #36''s pre-regression baseline and diagnosis artifacts (`tmp/issue-36/artifacts/`);
  commits `85b9586`, `3f54ad3`, `907843d`, `5523299` (git forensics grounding). Call
  to action: review the full 5-SC spec at the `issues-data` link above and approve
  for plan creation.


  ---


  🤖 Co-authored with AI: OpenCode (ollama-cloud/glm-5.3-flash)

