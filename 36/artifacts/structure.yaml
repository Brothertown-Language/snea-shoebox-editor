spec: ".issues/36/spec.md (issues-data HEAD, revision tier-1 iteration 3, 2026-09-29)"
provenance: "generated by writing-plans research task (2026-09-29); SC↔Item mapping from decompose-output.yaml (1:1, SC-1..SC-12 ↔ D1-ITEM-1..D1-ITEM-12)"
sc_count: 12
phase_count: 6

# Decomposition rationale:
# Concern-boundary grouping follows concern-map.yaml CG-1..CG-4 and the spec
# Traceability phase column. CG-1 splits across phases 1-3 because the model
# artifacts (SC-1) must be committed before embedding_service tests (SC-2),
# the schema models (SC-3) must exist before the migrations (SC-4) that create
# them on the DB, and the dependency manifest (SC-10) is needed before any
# runtime test of onnx/tokenizer-based code. SC-10 is placed in phase 3 with
# migrations because the profiler evidence artifact also requires the encode
# path (phase 2) and the manifest check gates every later runtime test cycle.
# Phases are strictly sequential: substrate → schema → services → calibration → data plane.
# The #1385 UI spec owns end-user surface; CG-4's st.* surface (admin backfill
# only) is the sole authorized Streamlit surface in this spec (table_maintenance.py).

phases:
  - id: 1
    name: "Pinned model artifacts substrate"
    concern: "Commit byte-pinned gte-small INT8 ONNX + tokenizer.json with SHA256 hash check (CG-1 part 1)"
    scs: ["SC-1"]
    depends_on: []
    files:
      - "models/gte-small/onnx/model_qint8_avx512_vnni.onnx (new, committed bytes)"
      - "models/gte-small/tokenizer.json (new, committed bytes)"
      - "scripts/ verification: hash check (CI/script hash check per SC-1 verification method)"
    items:
      - item: "Item 1 (SC-1)"
        red: "hash check fails on absent/mismatched models/gte-small/ artifacts"
        green: "commit ONNX (34,118,638 B; SHA256 c9434b8d71617919a3ef61f1fafea4b15b4e02d782cc287623158713881e34cd) + tokenizer.json (711,661 B; SHA256 da0e79933b9ed51798a3ae27893d3c5fa4a201126cef75586296df9b4d2c62a0)"
        verify: "hash check exit 0 vs recorded pins"
        commit: "models/ artifacts + hash check"

  - id: 2
    name: "Embedding service substrate (encode + singleton)"
    concern: "embedding_service encode pipeline + load-once process-wide session singleton (CG-1 parts 2-3: R-2/R-14)"
    scs: ["SC-2", "SC-12"]
    depends_on: [1]
    dependency_note: "encode tests exercise artifacts from phase 1 (byte-identical ONNX+tokenizer); RED/GREEN/COMMIT for both SCs stay inside this phase"
    files:
      - "src/services/embedding_service.py (new)"
    items:
      - item: "Item 2 (SC-2)"
        red: "pytest asserting encode() missing → fails"
        green: "src/services/embedding_service.py encode() per R-2 invariants (shape (1,384), unit norm, batch-64 padding path); errors raised with context"
        verify: "pytest unit — shape (1,384), norm 1.0, batch-64 padding"
        commit: "embedding service encode + test"
      - item: "Item 12 (SC-12)"
        red: "pytest asserting load_model() absent or returns distinct sessions across calls → fails"
        green: "load_model() returns process-wide singleton onnxruntime session (module-level holder, streamlit-import-free) with one-at-a-time in-flight lock; encode-invariant companion obligations verified in same GREEN per spec Item 12"
        verify: "pytest concurrency — N threads load_model() → identical session handle, registry count == 1; profiler artifact vs R-14 references and 1 GiB envelope"
        commit: "embedding service load_model() singleton"

  - id: 3
    name: "pgvector schema + DDL migrations + dependency manifest"
    concern: "Additive two-table schema models, DDL-only versioned migrations with extversion assert, dependency manifest + memory envelope (CG-2 + R-10 + R-3/R-4)"
    scs: ["SC-3", "SC-4", "SC-10"]
    depends_on: [2]
    dependency_note: "migrations (SC-4) create the schema the ORM models (SC-3) declare — same-phase ordering, triplet intact. SC-10 manifest check unblocks every later runtime test cycle (uv sync with onnxruntime+tokenizers runtime deps); profiler evidence consumes phase 2 encode"
    files:
      - "src/database/models/search.py"
      - "src/database/migrations.py"
      - "pyproject.toml"
      - "profiler evidence artifact (batch-64 RSS vs 1 GiB)"
    items:
      - item: "Item 3 (SC-3)"
        red: "introspection asserting columns/table absent → fails"
        green: "src/database/models/search.py: GlossSearchEntry +3 columns (embedding vector(384), entry_type, embedding_model); new SemanticSearchEntry + SemanticSearchResult dataclass; additive-only"
        verify: "schema introspection on synced DB"
        commit: "models/search.py"
      - item: "Item 4 (SC-4)"
        red: "migration test asserting missing version rows/objects → fails"
        green: "append 2 registry entries (YYYYMMDDSSSSS): CREATE TABLE semantic_search_entries + ALTER TABLE gloss_search_entries ADD COLUMN ×3; pgvector extversion assert; reversible drops documented"
        verify: "isolated migration test (#1346 pattern): applied once, version rows advanced, objects created, idempotent on rerun"
        commit: "migrations.py"
      - item: "Item 10 (SC-10)"
        red: "manifest check asserting onnxruntime/tokenizers absent from runtime deps → fails; profiler artifact absent → fails"
        green: "pyproject.toml: add onnxruntime + tokenizers to dependencies (sentence-transformers stays dev-only, verified live at :32); profiler evidence artifact"
        verify: "manifest check + batch-64 load+encode RSS measurement vs 1 GiB envelope (measured reference 312 MiB)"
        commit: "pyproject.toml + evidence"

  - id: 4
    name: "Search semantic seam + mode dispatch"
    concern: "search_semantic() v1 contract service + additive SearchMode widening and dispatch entries (CG-3 part 1: R-5/R-13)"
    scs: ["SC-5", "SC-11"]
    depends_on: [1, 2, 3]
    dependency_note: "seam tests need schema columns/table (phase 3) and encode (phase 2) — both earlier phases; SC-11 widening and SC-5 seam GREEN both live here, no triplet split"
    files:
      - "src/services/semantic_search_service.py (new)"
      - "src/services/linguistic_service.py"
    items:
      - item: "Item 5 (SC-5)"
        red: "pytest asserting seam absent/incorrect statuses → fails"
        green: "src/services/semantic_search_service.py: encode query → cosine rank over both tables (pin join embedding_model == pin) → threshold (None→0.80) → full ranked list desc, record_id-asc tie-break → SemanticSearchResult; no streamlit imports"
        verify: "pytest service-layer vs freshly synced DB (R-12 re-sync first); contract field list exact"
        commit: "semantic search service"
      - item: "Item 11 (SC-11)"
        red: "pytest asserting 'Semantic Gloss'/'Semantic All' absent from SearchMode Literal and unmatched by dispatch → fails"
        green: "src/services/linguistic_service.py: widen SearchMode Literal at :28 with 'Semantic Gloss'/'Semantic All'; add dispatch entries routing both modes to search_semantic(); existing strategies/signature/return type unchanged (companion obligations verified in same GREEN per spec Item 11)"
        verify: "pytest dispatch-routing — widened Literal + new entries route to search_semantic(); existing four modes route unchanged"
        commit: "linguistic_service.py widening + test"

  - id: 5
    name: "Calibration + degraded semantics"
    concern: "Calibration anchor floors on freshly synced data + degraded status edge semantics (CG-3 part 2: R-6/R-7)"
    scs: ["SC-6", "SC-7"]
    depends_on: [4]
    dependency_note: "calibration and edge-matrix tests exercise the phase 4 seam — earlier phase, allowed; SC-6/SC-7 RED+GREEN+COMMIT both complete inside this phase"
    files:
      - "calibration module + per-anchor evidence artifact (new)"
      - "src/services/semantic_search_service.py (edge guards)"
    items:
      - item: "Item 6 (SC-6)"
        red: "calibration pytest asserting seam against unimplemented floors → fails"
        green: "calibration module asserting recorded anchors on freshly synced data; per-anchor evidence artifact (positives round/bed/house/peas/hunt ≥ per-anchor floors; negatives ≥0.07 below; default threshold 0.80)"
        verify: "pytest produces calibration evidence with per-anchor scores (R-12 re-sync first)"
        commit: "calibration test + evidence"
      - item: "Item 7 (SC-7)"
        red: "pytest asserting exceptions on edge inputs → fails"
        green: "guard empty/whitespace before model invocation; pin-join exclusions; statuses empty_query/no_embeddings/stale_model/ok+empty + messages naming admin backfill remedy"
        verify: "pytest edge matrix vs synced DB — every input yields correct status, never an exception"
        commit: "service edge handling"

  - id: 6
    name: "Data plane — upload inline embedding + admin backfill UI"
    concern: "Inline embedding inside populate_search_entries() + admin Embedding Backfill button in Table Maintenance (CG-4: R-8/R-9/R-11, sole authorized st.* surface)"
    scs: ["SC-8", "SC-9"]
    depends_on: [2, 3, 4, 5]
    dependency_note: "upload path needs encode (phase 2) + columns (phase 3); admin UI needs backfill recompute semantics proven by phase 5 exclusion behavior; RED/GREEN/COMMIT for both SCs inside this phase"
    files:
      - "src/services/upload_service.py"
      - "test/test_upload_search_entries.py"
      - "src/frontend/pages/table_maintenance.py"
    items:
      - item: "Item 8 (SC-8)"
        red: "extend test_upload_search_entries asserting no embeddings produced → fails"
        green: "populate_search_entries() embeds new primary ge rows inline (signature unchanged); pin-stamped embedding_model; batch ≤512; Unicode exact"
        verify: "extended test on real synced records (R-12 re-sync first) — embeddings, pin, Unicode fidelity, batch ≤ 512"
        commit: "upload service + test"
      - item: "Item 9 (SC-9)"
        red: "Playwright asserting no backfill control exists → fails"
        green: "sibling section beside render_data_reprocessing_maintenance(); backfill service method with st.progress + callback + st.status; role gate reused; model-change recompute; handle_ui_error surfacing"
        verify: "Playwright click-through on synced DB (role-gated; isolated from #1347; rate reference 6,266 terms/72.2 s)"
        commit: "table_maintenance.py + backfill method"

# Dependency DAG (phase → phase):
#   1 → 2 → 3 → 4 → 5 → 6  (strict chain; no cycles; every phase reachable from start)
# All edges point from later-consumer to earlier-producer (allowed direction);
# verified: no RED test in phase X depends on SC-M output from phase Y where Y > X.

dependency_dag:
  - phase: 1
    depends_on: []
  - phase: 2
    depends_on: [1]
  - phase: 3
    depends_on: [2]
  - phase: 4
    depends_on: [1, 2, 3]
  - phase: 5
    depends_on: [4]
  - phase: 6
    depends_on: [2, 3, 4, 5]

verifications:
  triplet_colocation: "PASS — for every SC, RED/GREEN/COMMIT steps all assigned to the same phase (SC-1→P1; SC-2,SC-12→P2; SC-3,SC-4,SC-10→P3; SC-5,SC-11→P4; SC-6,SC-7→P5; SC-8,SC-9→P6)"
  cross_phase_dependency: "PASS — every RED test depends only on same-phase or earlier-phase outputs; no backward edges"

# Skill+task selection per implementation-workflow reference card:
# Each item's per-task cycle = red → green → (post-regression) → verify → commit-inline.
# Dispatch strings from .opencode/skills/writing-plans/reference/implementation-workflow.md.
preflight_steps:
  pre-regression: {skill: test-driven-development, dispatch: "task(..., prompt: \"execute phase-0 task from test-driven-development\")"}
  pre-regression-verify: {skill: verification-before-completion, dispatch: "task(..., prompt: \"execute verify task from verification-before-completion\")"}

skill_task_selection:
  red: {skill: test-driven-development, dispatch: "task(..., prompt: \"execute red task from test-driven-development\")"}
  green: {skill: test-driven-development, dispatch: "task(..., prompt: \"execute green task from test-driven-development\")"}
  post-regression: {skill: test-driven-development, dispatch: "task(..., prompt: \"execute phase-4 task from test-driven-development\")"}
  verify: {skill: verification-before-completion, dispatch: "task(..., prompt: \"execute verify task from verification-before-completion\")"}
  commit-inline: {skill: "(orchestrator)", dispatch: "orchestrator runs git add <files> && git commit directly — no sub-agent dispatch"}

post_phase_steps:
  audit: {skill: audit, dispatch: "task(..., prompt: \"execute verification-audit DiMo investigator from audit. Read `audit/tasks/verification-audit-investigator.md` first\") — followed by validator, evaluator, arbiter in sequence"}
  z3-check: {skill: "(orchestrator)", dispatch: ".opencode/tools/solve check --state-path ... --contract-path ..."}
  structural-checks: {skill: finishing-a-development-branch, dispatch: "task(..., prompt: \"execute checklist task from finishing-a-development-branch\")"}
  pre-pr-gate: {skill: verification-before-completion, dispatch: "task(..., prompt: \"execute verify task from verification-before-completion\")"}
  regression-check: {skill: test-driven-development, dispatch: "task(..., prompt: \"execute phase-4 task from test-driven-development\")"}
  review-prep: {skill: git-workflow-pr, dispatch: "task(..., prompt: \"execute review-prep from git-workflow-pr. Read `git-workflow-pr/tasks/review-prep.md` first\")"}
  create-pr: {skill: git-workflow-pr, dispatch: "task(..., prompt: \"execute create task from git-workflow-pr\")"}
  exec-summary: {skill: completion-core, dispatch: "task(..., prompt: \"execute completion task from completion-core\")"}