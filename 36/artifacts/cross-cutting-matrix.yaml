# Artifact 4/7: Cross-Cutting Matrix — issue 36 spec analysis
# Source: handoff preliminary/cross-cutting.md (complete); ownership split per developer decisions
cross_cutting_matrix:
  - concern: "Streamlit session rerun model"
    touches: ["search trigger + preference widgets (UI spec)", "backfill button (36)"]
    owner_split: "UI spec for search+prefs; 36 for backfill"
    mitigation: "compute-once/rank-once design avoids per-rerun recompute"
  - concern: "Resource caching (@st.cache_resource pattern, verified streamlit_app.py:91)"
    touches: ["model load (36)", "model session lifecycle"]
    owner_split: "36"
    mitigation: "cold load +13.5 ms/query measured; survives reruns"
  - concern: "DB write batching"
    touches: ["migration upserts", "backfill writes", "upload embeds"]
    owner_split: "36"
    mitigation: "batch ≤ 512 rows (090 guideline; 65,535 param cap)"
  - concern: "Regression sync protocol"
    touches: ["all SCs both specs"]
    owner_split: "36 owns; UI spec consumes synced DB"
    mitigation: "scripts/sync_prod_to_local.sh before every test cycle (AGENTS.md mandate)"
  - concern: "Unicode / linguistic data integrity"
    touches: ["gloss text → tokenizer input"]
    owner_split: "36"
    mitigation: "gte-small BERT tokenizer Unicode-native (verified); no normalization layers added; 2026-06-13 lessons apply to FTS paths only (unchanged)"
  - concern: "Memory budget (Streamlit Cloud 1 GB)"
    touches: ["model + onnxruntime", "ranked lists"]
    owner_split: "36 owns model/runtime; UI list slices ≤ few hundred KB"
    mitigation: "measured batch-64 RSS 312 MiB; envelope SC (SC-10)"
  - concern: "Empty/degraded states"
    touches: ["service payload", "UI rendering"]
    owner_split: "36 owns (status, message); UI spec owns rendering"
    mitigation: "single status enum at seam; message text centralized in service"
  - concern: "Security / role gating"
    touches: ["admin backfill button"]
    owner_split: "36"
    mitigation: "existing Table Maintenance admin gate reused (:128-130)"
  - concern: "Offline-first framing"
    touches: ["dependency declaration", "docs"]
    owner_split: "36"
    mitigation: "reframed: in-process ONNX only, no third-party embedding API calls; app itself is Streamlit Cloud + Aiven (online by definition)"
  - concern: "Performance floor"
    touches: ["per-query latency", "upload throughput", "backfill duration"]
    owner_split: "36 (all three)"
    mitigation: "measured: 13.5 ms/query encode; upload +10-60 ms/record; backfill 6,266 terms/72.2 s"
  - concern: "Determinism (pagination stability)"
    touches: ["ranking tie-break", "slice paging"]
