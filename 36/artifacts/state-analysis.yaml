state_analysis:
  persistent_state:
    - state: "gloss_search_entries.embedding"
      type: "pgvector vector(384)"
      change: "new column, NULL until embedded"
      recovery_rollback: "reversible DDL (DROP COLUMN) documented with migration; NULL-safe — excluded from vector search"
    - state: "gloss_search_entries.entry_type / embedding_model"
      type: "String"
      change: "new columns, per migration 1"
      recovery_rollback: "same DROP COLUMN path"
    - state: "semantic_search_entries table"
      type: "new relational table (id PK, record_id FK CASCADE, entry_type, term, embedding, embedding_model)"
      change: "new table + rows only on embed/upload/backfill"
      recovery_rollback: "reversible DDL (DROP TABLE); CASCADE on record delete (developer-approved spec intent; note: sibling gloss_search_entries uses RESTRICT live — difference documented in spec)"
    - state: "schema_version rows"
      type: "registry inserts"
      change: "2 versioned rows"
      recovery_rollback: "version-gated, idempotent by design (verified _run_migrations mechanics)"
    - state: "models/ artifacts"
      type: "git-tracked binaries"
      change: "+34.8 MB repo weight"
      recovery_rollback: "git revert; SHA-pinned integrity check"
    - state: "user semantic_threshold preference row"
      type: "user_preferences (view_name='records', key='semantic_threshold')"
      change: "UI spec; per-user"
      recovery_rollback: "absent → default '0.80' (service default); delete row → revert"
  in_memory_state:
    - state: "ONNX runtime session"
      location: "@st.cache_resource pattern (streamlit_app.py:91 verified)"
      note: "cold load +13.5 ms/query; survives reruns"
    - state: "ranked result list"
      location: "Streamlit session (UI spec)"
      note: "≤ few hundred KB worst case; sliced for pagination (rank-once)"
    - state: "threshold widget state"
      location: "st.session_state widget keys"
      note: "invalid edits rejected + snap-back"
    - state: "backfill progress"
      location: "transient st.progress / st.status"
      note: "non-durable by design; completion logged"
  state_machine:
    row_embedding_lifecycle:
      states: ["NULL (never embedded)", "embedded (model=pin)", "stale (model≠pin)"]
      transitions:
        - "NULL → embedded: upload inline embed OR backfill"
        - "embedded → stale: model pin changes (future model change)"
        - "stale → embedded: re-run backfill after pin change"
      invariants:
        - "searchability requires state == embedded (embedding_model == pin join)"
        - "stale excluded same as never-embedded at query; degradation to empty state, never error"
    search_request_lifecycle:
      states: ["query received", "guarded (empty/whitespace → empty_query)", "ranked", "thresholded", "sliced (UI)"]
      transitions:
        - "query → guarded: empty/whitespace exits before model invocation"
        - "guarded → ranked: encode + cosine rank (full list, deterministic tie-break)"
        - "ranked → thresholded: threshold filter (None → 0.80)"
        - "thresholded → sliced: UI pagination"
      invariants: ["no re-rank on page navigation"]
  sync_invariant: "scripts/sync_prod_to_local.sh replicates ALL prod tables incl. embeddings; local DBs never re-embed (verified in brainstorming session)"