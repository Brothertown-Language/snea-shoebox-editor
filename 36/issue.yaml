title: '[SPEC] Semantic Gloss Search with pgvector (db/embed revision)'
status: open
labels:
- approved-for-plan
body: "> **Full spec and plan artifacts: https://github.com/Brothertown-Language/snea-shoebox-editor/tree/issues-data/.issues/36/**\n\
  >\n> **Local artifacts:** `.issues/36/` — analytical artifacts, sc-summary, audit\
  \ findings\n\n## Problem\n\nExisting English-gloss search is exact-text only — linguists\
  \ searching \"round\" cannot find \"spherical object\" glosses, and free-text gloss\
  \ variation makes exact matching tedious and incomplete. Semantic (meaning-based)\
  \ search over English glosses closes this gap. This body is the REVISION of #36\
  \ to the developer-approved db/embed scope (2026-09-28 brainstorming, 10 turns,\
  \ design approved): wrong model pin (all-MiniLM-L6-v2), startup-backfill implication,\
  \ and dependency direction are corrected with measured, pinned values; the 2026-09-29\
  \ developer-authorized OOM-safety amendment additionally fixes multi-user memory\
  \ safety (load-once model singleton); the tier-1 validation revisions (2026-09-29,\
  \ iterations 1-3) add SC-11 (additive SearchMode Literal widening + semantic dispatch\
  \ seam in `linguistic_service.py`) and SC-12 (load-once singleton contract, de-bundled\
  \ from SC-2), correct the singleton memory figure to the pinned gte-small ~128 MB,\
  \ uplift SC-11's evidence type to behavioral (dispatch routing is runtime-behavioral\
  \ substrate), record the full 64-hex tokenizer.json SHA256 pin for an executable\
  \ CI hash check, and uplift SC-4's evidence type to behavioral (migration execution\
  \ outcomes are runtime-behavioral substrate, iteration 3). The end-user interface\
  \ is filed as its own spec: #1385.\n\n## Scope\n\n- Pin `thenlper/gte-small` via\
  \ committed INT8 ONNX artifacts at `models/gte-small/` with SHA256 integrity checks\
  \ (ONNX 34,118,638 B `c9434b8d…34cd`; tokenizer.json 711,661 B, full SHA256 pin\
  \ `da0e79933b9ed51798a3ae27893d3c5fa4a201126cef75586296df9b4d2c62a0` recorded in\
  \ the spec — CI/script hash check executable from spec text).\n- pgvector schema:\
  \ `gloss_search_entries` gains `embedding vector(384)`, `entry_type`, `embedding_model`\
  \ (primary `ge`); new `semantic_search_entries` table (record_id FK CASCADE, entry_type,\
  \ term, embedding, embedding_model) for `ge_subentry`, `ge_sense`, `ge_in_sense`,\
  \ `xe`, `ce`, `eg` — additive-only.\n- Two DDL-only versioned migrations (append-only\
  \ registry, pgvector extversion assert, reversible drops documented, NO startup\
  \ backfill) + `embedding_service` (process-wide load-once ONNX session singleton,\
  \ race-safe under a one-at-a-time in-flight lock; tokenize(512) → ONNX → mean-pool\
  \ → L2-normalize, batch ≤ 64) + `semantic_search_service.search_semantic()` seam\
  \ returning `SemanticSearchResult{results: list[(record_id, score)], status ∈ {ok,\
  \ empty_query, no_embeddings, stale_model}, message}`.\n- Upload-path inline embedding\
  \ inside `populate_search_entries()` (signature unchanged) and admin Embedding Backfill\
  \ button in Table Maintenance → Data Reprocessing (`st.progress`/`st.status` idiom,\
  \ role-gated).\n- Runtime deps gain `onnxruntime` + `tokenizers`; `sentence-transformers`\
  \ stays dev-only; calibration anchors (positives ≥ their per-anchor floors within\
  \ the recorded 0.85-0.90 band — per-anchor values recorded per-anchor in the calibration\
  \ evidence artifact, negatives ≥0.07 margin, default threshold 0.80) verified on\
  \ synced real data.\n\n**Out of scope (owned by #1385):** records-page mode radio\
  \ entries, threshold preference widget, score display, pagination UI, empty-state\
  \ rendering; backend `SearchMode` UI wiring beyond the additive SC-11 seam (Literal\
  \ widening + dispatch entries only). Also out of scope: semantic search on Algonquian\
  \ headwords or non-gloss fields (de/ue/nt/ng/dn/gn/xn), external embedding APIs,\
  \ replacing existing exact-match modes, MDF parser changes, migration renumbering,\
  \ `preference_service.py` changes, fine-tuned Algonquian term-space models (separate\
  \ future spec).\n\n## Approach\n\nPin the model as git-committed byte-exact binaries\
  \ so embedding generation is deterministic, offline-compatible, and environment-independent;\
  \ run it in-process via onnxruntime behind a load-once process-wide session singleton\
  \ (13.5 ms/query measured; 312 MiB batch-64 RSS vs 1 GiB Streamlit Cloud envelope;\
  \ worst-case resident-set references ~128 MB gte-small INT8 / ~472 MB e5-small INT8\
  \ / ~520 MB both-resident, measured 2026-09-29). Because Streamlit runs one script\
  \ thread per user session, per-session model loads would multiply the pinned ~128\
  \ MB resident weight per concurrent user — the singleton plus a race-safe in-flight\
  \ reload lock keeps multi-user memory flat (concurrent session `Run()` thread-safety\
  \ verified: 8 threads, deterministic outputs). Store vectors with pgvector (`vector(384)`)\
  \ across two additive tables matching the existing one-table-per-search-concern\
  \ pattern, created by DDL-only versioned migrations — developer directive removed\
  \ startup backfill; population happens inline during upload and explicitly via the\
  \ admin backfill. The search service exposes a single UI-agnostic seam (`search_semantic`,\
  \ v1 field list) with deterministic ranking (desc cosine, record_id-asc tie-break)\
  \ and a status enum that degrades safely (empty/no-embeddings/stale-model) instead\
  \ of erroring; rows search only when `embedding_model == pin`, making model-change\
  \ recompute self-healing. The admin backfill mirrors the proven Data Reprocessing\
  \ idiom with progress reporting and the existing role gate. Additively, the `SearchMode`\
  \ Literal widens with 'Semantic Gloss'/'Semantic All' and their dispatch entries\
  \ route to `search_semantic()` so the seam is backend-reachable without UI changes\
  \ (SC-11, behavioral evidence via pytest dispatch-routing test).\n\n## Impact\n\n\
  - **Risk: schema/migration breakage across environments** — additive-only DDL with\
  \ version-gated idempotent migrations, reversible drop statements documented, isolated\
  \ migration tests (known #1346 flake pattern). Key dependency: pgvector already\
  \ ensured (`_ensure_extensions()`, `pgvector>=0.3.6`).\n- **Risk: multi-user OOM\
  \ on Streamlit Cloud (1 GiB envelope)** — the singleton contract (SC-12) plus measured\
  \ resident-set references keep worst-case memory under the envelope; per-user-session\
  \ load rejection and concurrency test are explicit SC evidence. Key dependency:\
  \ `onnxruntime` + `tokenizers` in runtime deps; sentence-transformers dev-only.\n\
  - **Risk: calibration drift on future data re-syncs** — recorded per-anchor floors\
  \ are the SC evidence; a material distribution shift triggers the owned re-baseline\
  \ procedure rather than silent threshold changes. Key dependency: fresh `sync_prod_to_local.sh`\
  \ before every test cycle (AGENTS.md mandate).\n\nCall to action: review the revised\
  \ body; approval tracking via issue comments (not body edits).\n\n---\n\n\n\uD83E\
  \uDD16 OpenCode (ollama-cloud/glm-5.3-flash) created\n"
