# dependency-contract.yaml — .issues/1397
schema_version: 1
issue: 1397
description: >
  Phase-completion contract for issue 1397. Variables represent phase completion
  booleans; invariants encode the dependency DAG edges from structure.yaml.
# Extracted as-is from interface-compatibility.yaml dependency_contract section
dependency_contract_from_interface_compatibility:
  real_sources:
    - ".streamlit/secrets.toml (local dev store, existing)"
    - ".streamlit/secrets.toml.production (production template, existing)"
  real_targets:
    - "required-secrets manifest file (new; consumed by guard and preflight)"
    - "preflight report structure (new; dict with missing-key path list, no values)"
  type_constraints:
    - "manifest: YAML/TOML list of dotted key paths (str), never value pairs"
    - "preflight check: takes store-mapping (nested dict) + manifest paths -> returns missing-path list (list[str])"
    - "guard integration: missing contact keys -> default-fallback resolution consuming the manifest (Revision 1: one-time non-blocking warning naming key PATH only, static default contact.mastodon_url, NO RuntimeError); divergence with preflight prevented by shared manifest source"

variables:
  phase1_complete: {type: bool, description: "required-secrets manifest defined and committed"}
  phase2_complete: {type: bool, description: "preflight verification implemented (incl. SC-5 value-safety)"}
  phase3_complete: {type: bool, description: "guard coupled to manifest"}
  phase4_complete: {type: bool, description: "outage remediation runbook written"}

invariants:
  # DAG edges (structure.yaml dependency_dag)
  - "z3.Implies(phase2_complete, phase1_complete)"
  - "z3.Implies(phase3_complete, phase1_complete)"
  - "z3.Implies(phase3_complete, phase2_complete)"
  - "z3.Implies(phase4_complete, phase2_complete)"
  # Triplet co-location: each SC committed within its phase — phases are atomic
  - "z3.Or(z3.Not(phase1_complete), phase1_complete)"
