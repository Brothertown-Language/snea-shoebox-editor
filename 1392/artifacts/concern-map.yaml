# Concern Map — Issue 1392 — decomposes SCs into concern groups mapped to phase boundaries
# Backfilled retroactively; grounded in spec.md §5/§7 and plan.md phases.
spec: .issues/1392/spec.md
status: backfilled

concern_groups:
  - id: CG-1
    name: configuration-and-documentation-enablement
    scs: [SC-6, SC-7]
    phase: Phase 1
    description: >
      Secrets templates gain contact.maintainer_label (SC-6) and the
      local-development guidance documents it (SC-7). Enablement concern: the
      code phase's SC-1 behavioral verify and SC-4 success path both require
      the key this concern supplies.
    phase_boundary: "Phase 1 complete when both greps return hits in their targets"

  - id: CG-2
    name: contact-resolution-core
    scs: [SC-3, SC-2, SC-5]
    phase: Phase 2
    description: >
      Single-source-of-truth concern: the shared get_maintainer_label()
      resolution path (SC-3) feeds the 3 call sites; the raw token removal
      (SC-2) and the AST placeholder sweep (SC-5) co-locate — SC-5's RED runs
      while the literals are still present, GREEN after SC-2's removal, per
      spec §5 Items preamble.
    phase_boundary: "Zero <MAINTAINER_CONTACT> matches with --include='*.py'; sweep test passes"

  - id: CG-3
    name: fail-fast-startup-validation
    scs: [SC-4]
    phase: Phase 2
    description: >
      Startup integrity concern: main() validates contact.maintainer_label
      before any dialog renders and aborts with an actionable error naming the
      key.
    phase_boundary: "pytest asserts error raised from startup with key named"

  - id: CG-4
    name: live-browser-rendering
    scs: [SC-1, SC-8]
    phase: Phase 2
    description: >
      End-user rendering concern: the SC-8 SNEA_SIMULATE_AUTH mechanism
      (authorized|unauthorized|anonymous, gated on [runtime] mode == "local")
      is what makes SC-1's unauthorized-state Playwright verification
      executable at all — the simulation executes between Item 1's GREEN and
      Item 1's verify.
    phase_boundary: "Playwright e2e passes all three simulated states; dialog shows resolved label, no raw token"

sequencing_notes:
  - "CG-1 precedes all Phase 2 concerns (key dependency)."
  - "CG-2's SC-3 precedes SC-2/SC-5 (call sites consume the helper first)."
  - "CG-4's SC-8 precedes SC-1's verify (dialog unreachable without simulation)."
  - "CG-3 (SC-4) can execute after SC-3 within Phase 2 without ordering constraints."
