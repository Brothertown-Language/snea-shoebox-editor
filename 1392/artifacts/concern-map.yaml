# concern-map.yaml — backfilled from .issues/1392/spec.md
spec: .issues/1392/spec.md
issue: 1392

concern_groups:
  - id: CG-1
    name: Configuration & documentation enablement
    scs: [SC-6, SC-7]
    phase: Phase 1
    rationale: >
      Adding contact.maintainer_label to both secrets templates and documenting it
      must precede the code phase: SC-1's behavioral verify and SC-4's post-validation
      startup both need the key present in test secrets to pass. (Spec §5 preamble and
      §7 Traceability: R-5/R-6 → Phase 1.)
    files: [.streamlit/secrets.toml, .streamlit/secrets.toml.production, docs/development/local-development.md]

  - id: CG-2
    name: Secrets-based resolution & fail-fast validation
    scs: [SC-3, SC-1, SC-2, SC-4]
    phase: Phase 2
    rationale: >
      One shared resolution helper (SC-3) is the prerequisite consumed by the 3
      call-site migrations (SC-1 login dialog, SC-2 token removal) and paired with
      startup validation (SC-4). Within the phase SC-3 precedes SC-1/SC-2/SC-4.
      (Spec §5: "the shared resolution path (Item 3) precedes the call-site
      migrations that consume it (Items 1, 2, 4)".)
    files: [src/frontend/pages/login.py, streamlit_app.py, shared resolution helper (new), startup validation (new)]

  - id: CG-3
    name: Placeholder sweep enforcement
    scs: [SC-5]
    phase: Phase 2 (co-located with SC-2)
    rationale: >
      Sequencing constraint: SC-5's RED must run while the 3 <MAINTAINER_CONTACT>
      literals are still present (pre-SC-2-removal window) and SC-5's GREEN/verify/
      commit run after SC-2's GREEN — so the entire SC-5 cycle co-locates with the
      SC-2 removal inside Phase 2. (Spec §5 preamble; resolves the TRIPLET_SPLIT
      research finding recorded in change control 2026-10-01.)
    files: [test/ (AST sweep test), src/ and streamlit_app.py (remediation targets)]

phase_boundaries:
  - phase: Phase 1
    concern_groups: [CG-1]
    exit_criterion: maintainer_label present in both secrets templates + documented (SC-6, SC-7 verified)
  - phase: Phase 2
    concern_groups: [CG-2, CG-3]
    exit_criterion: all code SCs verified (SC-1..SC-5); depends on Phase 1 key availability

cross_phase_dependencies:
  - from: SC-6 (Phase 1)
    to: SC-1 (Phase 2), SC-4 (Phase 2)
    constraint: test secrets must carry contact.maintainer_label before behavioral/startup verification can pass
  - from: SC-2 (Phase 2, CG-2)
    to: SC-5 (Phase 2, CG-3)
    constraint: SC-5 RED before SC-2 GREEN; SC-5 GREEN/verify/commit after SC-2 GREEN — atomic within Phase 2
  - from: SC-3 (Phase 2, CG-2)
    to: SC-1, SC-2, SC-4 (Phase 2, CG-2)
    constraint: shared resolution helper must exist before call-site migration and before startup validation consumes it
