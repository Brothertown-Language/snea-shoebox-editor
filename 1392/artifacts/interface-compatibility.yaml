# Interface Compatibility — Issue 1392 — module boundaries + dependency contract
spec: .issues/1392/spec.md
status: backfilled

interfaces:
  - boundary: "ui_utils ← callers (login.py, streamlit_app.py)"
    contract: "get_maintainer_label() -> str, no args; reads st.secrets['contact']['maintainer_label']; returns empty-string fallback only at module level (call sites treat empty as absent → SC-4 fails fast at startup)"
    compatibility: "streamlit_app.py already imports from src.frontend.ui_utils (line 14) — additive import, no new module"
  - boundary: "secrets config ← code"
    contract: "st.secrets['contact']['maintainer_label'] (str); st.secrets['runtime']['mode'] (str, 'local' | production); st.secrets['contact']['mastodon_url'] unchanged"
    compatibility: "additive key in existing [contact] section; [runtime] section already exists (mode = 'local' in dev template)"
  - boundary: "identity path ← simulation hook"
    contract: "SNEA_SIMULATE_AUTH env var read only when st.secrets['runtime']['mode'] == 'local'; domain = {authorized, unauthorized, anonymous}; branch lands in identity_service.py is_unauthorized path; no cookie fabrication"
    compatibility: "new branch in existing identity flow (identity_service.py:88 sets st.session_state['is_unauthorized']); production mode short-circuits before env read"
  - boundary: "startup validation ← main()"
    contract: "main() raises actionable error naming contact.maintainer_label when key absent, after st.set_page_config, before any dialog render"
    compatibility: "existing main() startup path; no interface change for callers"

dependency_contract:
  source: "derived from spec §3/§4 and affected files; live-verified 2026-10-01"
  edges:
    - id: sc3_shared_helper
      source: src/frontend/ui_utils.py get_maintainer_label
      target: src/frontend/pages/login.py show_unauthorized_dialog
      type: import_call
      constraint: "returns str; label rendered via st render call"
    - id: sc3_shared_helper_streamlit_app
      source: src/frontend/ui_utils.py get_maintainer_label
      target: streamlit_app.py _initialize_database
      type: import_call
      constraint: "two dialog call sites consume same helper"
    - id: sc6_key_to_resolution
      source: .streamlit/secrets.toml "[contact].maintainer_label"
      target: src/frontend/ui_utils.py get_maintainer_label
      type: config_read
      constraint: "key absent → SC-4 startup error, not silent default"
    - id: sc6_key_prod_template
      source: .streamlit/secrets.toml
      target: .streamlit/secrets.toml.production
      type: sync_directive
      constraint: "section order synchronized per file-header directive"
    - id: sc7_docs
      source: docs/development/local-development.md
      target: operators
      type: documentation
      constraint: "grep maintainer_label ≥1 hit"
    - id: sc8_mode_guard
      source: .streamlit/secrets.toml "[runtime].mode"
      target: SNEA_SIMULATE_AUTH hook
      type: config_guard
      constraint: "hook active only when mode == 'local'; inert in production"
    - id: sc8_sim_to_identity
      source: SNEA_SIMULATE_AUTH hook
      target: src/services/identity_service.py is_unauthorized path
      type: branch
      constraint: "unauthorized → st.session_state['is_unauthorized'] = True"
    - id: sc8_sim_to_sc1_verify
      source: SNEA_SIMULATE_AUTH mechanism
      target: SC-1 unauthorized-state Playwright test
      type: enablement
      constraint: "sc8_done precedes SC-1 verify; plan dependency edge SC-1←SC-8"
