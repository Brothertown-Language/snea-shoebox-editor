# State Analysis — Issue 1392 — state transitions required by each SC
spec: .issues/1392/spec.md
status: backfilled

state_transitions:
  - sc: [SC-4]
    transitions:
      - from: app startup
        to: startup validated
        condition: "st.secrets['contact']['maintainer_label'] present and non-empty"
      - from: app startup
        to: startup aborted
        condition: "key absent → actionable error naming contact.maintainer_label raised from main() initialization, before any dialog renders"
  - sc: [SC-1, SC-3]
    transitions:
      - from: session render state (dialog pre-render)
        to: dialog rendered with resolved text
        condition: "get_maintainer_label() returns the secrets value; dialog string contains no raw token"
  - sc: [SC-8]
    transitions:
      - from: "SNEA_SIMULATE_AUTH unset or production mode"
        to: "identity path behaves normally (real OAuth/identity sync)"
        condition: "mode guard: st.secrets['runtime']['mode'] != 'local' → variable ignored entirely"
      - from: "SNEA_SIMULATE_AUTH=authorized (local mode)"
        to: "identity sync succeeds; app in authenticated-authorized state"
      - from: "SNEA_SIMULATE_AUTH=unauthorized (local mode)"
        to: "st.session_state['is_unauthorized'] = True (identity_service.py is_unauthorized path) → Access Restricted dialog with resolved label"
      - from: "SNEA_SIMULATE_AUTH=anonymous (local mode)"
        to: "no auth → redirect to /login, no dialog"
  - sc: [SC-6]
    transitions:
      - from: secrets templates without key
        to: "both templates carry [contact].maintainer_label (section order preserved)"
  - sc: [SC-7]
    transitions: []
    note: documentation-only; no runtime state

invariants:
  - "No fabricated browser auth cookies in any transition (UI testing standard)."
  - "Session state is_unauthorized is set only by the identity path (real or simulated); dialogs read it (login.py:80/151, streamlit_app.py:262/280)."
  - "st.secrets reads are immutable per run — no shared mutable state, no race surface (spec §11)."
