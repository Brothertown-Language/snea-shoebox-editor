    name: "Configuration & documentation enablement"
    concern: >
      CG-1: contact.maintainer_label key added to both secrets templates (SC-6)
      and documented in the local-development secrets guidance (SC-7) — pure
      config/docs enablement with no code changes.
    depends_on: []
    scs: [SC-6, SC-7]
    exit_criterion: >
      maintainer_label present in both .streamlit secrets templates and documented
      (spec §7 Traceability R-5/R-6 → Phase 1)
    items:
      - sc: SC-6
        item: 6
        evidence_type: string
        order: 1
        red: "grep -n \"maintainer_label\" .streamlit/secrets.toml .streamlit/secrets.toml.production currently returns 0 hits in both files; enforcement test asserts ≥1 hit per file"
        green: "Add contact.maintainer_label (string value) under [contact] in .streamlit/secrets.toml and .streamlit/secrets.toml.production, preserving the section-order synchronization directive; additive only — no existing key removed or renamed"
        verify: "Re-run the grep; one hit in each file"
        commit: ".streamlit/secrets.toml, .streamlit/secrets.toml.production, and the grep enforcement test"
      - sc: SC-7
        item: 7
        evidence_type: string
        order: 2
        red: "grep -n \"maintainer_label\" docs/development/local-development.md currently returns 0 hits; enforcement test asserts ≥1 hit"
        green: "Document contact.maintainer_label in the \"Configure local secrets\" guidance of docs/development/local-development.md"
        verify: "Re-run the grep; ≥1 hit"
        commit: "docs/development/local-development.md and the grep enforcement test"

  - id: 2
    name: "Secrets-based resolution, fail-fast validation & placeholder sweep"
    concern: >
      CG-2 + CG-3: one shared resolution helper (SC-3) feeding the 3 call-site
      migrations (SC-1 login dialog, SC-2 token removal) paired with startup
      fail-fast validation (SC-4), plus the AST placeholder sweep (SC-5) whose
      RED/GREEN straddles SC-2's removal inside this same phase.
    depends_on: [1]
    scs: [SC-3, SC-1, SC-2, SC-5, SC-4]
    exit_criterion: "all code SCs verified (SC-1..SC-5); requires Phase 1 key availability"
    intra_phase_execution_order:
      - "1. Item 3 (SC-3) full cycle — shared resolution helper is the prerequisite consumed by Items 1, 2, 4 (spec §5)"
      - "2. Item 1 (SC-1) full cycle — login dialog routed through the helper; RED fails on the raw token, GREEN removes login.py's literal"
      - "3. Item 2 (SC-2) RED — grep asserts 0 `<MAINTAINER_CONTACT>` matches while literals remain (2 in streamlit_app.py after Item 1 GREEN)"
      - "4. Item 5 (SC-5) RED — AST sweep fails while `<MAINTAINER_CONTACT>` literals are still present (pre-Item-2-GREEN window per spec §5)"
      - "5. Item 2 (SC-2) GREEN → verify → commit — literals replaced at the remaining call sites"
      - "6. Item 5 (SC-5) GREEN → verify → commit — sweep now reports zero user-facing placeholders"
      - "7. Item 4 (SC-4) full cycle — startup fail-fast validation consumes the helper/secret path"
      - "Interleaving note: Item 5's RED runs before Item 2's GREEN and its GREEN/verify/commit run after Item 2's GREEN — the entire Item 5 triplet stays inside Phase 2 (resolves the TRIPLET_SPLIT finding recorded in spec change-control 2026-10-01)."
    items:
      - sc: SC-3
        item: 3
        evidence_type: semantic
        order: 1
        red: "Clean-room read of the 3 call sites confirms inline hardcoded contact text rather than a shared reference; test asserts a shared path exists and is referenced by all 3"
        green: "Add one shared resolution helper reading contact.maintainer_label from st.secrets (no args, returns str) and route all 3 call sites through it"
        verify: "Clean-room sub-agent reads the 3 former call sites and confirms each references the shared resolution path"
        commit: "the shared helper plus its reference from all 3 call sites"
      - sc: SC-1
        item: 1
        evidence_type: behavioral
        order: 2
        red: "Playwright real-browser test asserts the dialog shows the contact.maintainer_label value and no <MAINTAINER_CONTACT> token; fails because the raw token currently renders"
        green: "Route show_unauthorized_dialog() in src/frontend/pages/login.py through the shared resolution path"
        verify: "SNEA_E2E=1 uv run pytest test/ui/ -m playwright_e2e against the live app on :8501, per docs/development/ui_testing_standard.md (skip-by-design is never PASS)"
        commit: "src/frontend/pages/login.py and the Playwright test"
      - sc: SC-2
        item: 2
        evidence_type: string
        order: "3 (RED) / 5 (GREEN, verify, commit — straddled by Item 5's RED)"
        red: "grep -rn --include='*.py' \"<MAINTAINER_CONTACT>\" src/ streamlit_app.py currently returns 3 matches; enforcement test asserts 0"
        green: "Replace the literal at the remaining call sites with the shared resolution path"
        verify: "Re-run the grep with --include='*.py'; 0 matches (compiled __pycache__ artifacts out of scope)"
        commit: "src/frontend/pages/login.py, streamlit_app.py, and the grep enforcement test"
      - sc: SC-5
        item: 5
        evidence_type: string
        order: "4 (RED — pre-Item-2-GREEN) / 6 (GREEN, verify, commit — post-Item-2-GREEN)"
        red: "AST-based sweep test asserts zero <[A-Z][A-Z0-9_]{2,}> matches across user-facing Streamlit render-call string literals; fails while the <MAINTAINER_CONTACT> literals are still present"
        green: "Add the AST sweep test (st.write, st.info, st.error, st.warning, st.success, st.markdown, st.caption in src/ and streamlit_app.py); remediate any placeholder it finds (docstring tokens such as <SSSSS> in src/services/upload_service.py out of scope by AST construction)"
        verify: "uv run pytest test/ — zero pattern matches across scanned user-facing strings"
        commit: "the sweep test plus any remediation it drives"
      - sc: SC-4
        item: 4
        evidence_type: behavioral
        order: 7
        red: "Test invokes the app startup path with contact.maintainer_label absent and asserts an actionable error naming the key is raised from startup initialization; fails because no validation exists"
        green: "Add startup validation in streamlit_app.py main() that reads contact.maintainer_label and raises an actionable error naming the key when absent (st.set_page_config stays the first Streamlit command)"
        verify: "uv run pytest test/ — error raised from startup, not a dialog-render call; message names contact.maintainer_label"
        commit: "the startup validation and its test"

dependency_dag:
  edges:
    - from: 1
      to: 2
      reason: >
        SC-1's behavioral verify (Playwright dialog render) and SC-4's
        post-validation startup both require the contact.maintainer_label key that
        SC-6 adds to test secrets — the cross-phase dependency recorded in
        analysis-summary.yaml key_findings. Phase 1 must commit before Phase 2
        verification can pass.
  intra_phase_edges:
    - from: SC-3
      to: [SC-1, SC-2, SC-4]
      reason: "shared resolution helper must exist before call-site migration and startup validation consume it (concern-map cross_phase_dependencies)"
    - from: SC-2
      to: SC-5
      reason: "SC-5 RED before SC-2 GREEN; SC-5 GREEN/verify/commit after SC-2 GREEN — atomic within Phase 2"
    - from: SC-6
      to: [SC-1, SC-4]
      reason: "test secrets must carry contact.maintainer_label before behavioral/startup verification passes (Phase 1 → Phase 2 edge)"
  acyclicity: "PASS — single forward edge 1→2 plus intra-phase edges; no back-edges, no cycles"
  triplet_colocation: >
    PASS — 7/7 SCs have RED, GREEN, and COMMIT steps entirely inside their single
    assigned phase; zero splits. SC-5's RED/GREEN straddle of SC-2's removal is
    resolved by co-locating both in Phase 2 (spec §5 preamble, change-control
    2026-10-01).
  cross_phase_dependencies: >
    PASS — no RED test in any phase depends on SC output committed in a later
    phase. Phase 2 REDs (SC-1, SC-4) depend only on SC-6 output from Phase 1
    (earlier phase, Y < X — allowed); Phase 2 intra-phase dependencies (SC-3 →
    SC-1/SC-2/SC-4, SC-2 → SC-5) are same-phase execution ordering, not
    cross-phase violations. Phase 1 REDs (SC-6, SC-7) depend on no SC output.

