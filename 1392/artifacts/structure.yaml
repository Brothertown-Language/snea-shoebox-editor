# Structure — Issue 1392 — phase decomposition, dependency DAG, skill+task selection
spec: .issues/1392/spec.md
status: written

phases:
  - id: phase-1
    name: "Enablement — secrets key and documentation"
    scs: [SC-6, SC-7]
    items:
      - sc: SC-6
        steps: [red, green, verify, commit]
      - sc: SC-7
        steps: [red, green, verify, commit]
    skill_task_selection:
      - step: red
        skill: test-driven-development
        dispatch: "task(..., prompt: 'execute red task from test-driven-development')"
      - step: green
        skill: test-driven-development
        dispatch: "task(..., prompt: 'execute green task from test-driven-development')"
      - step: verify
        skill: verification-before-completion
        dispatch: "task(..., prompt: 'execute verify task from verification-before-completion')"
      - step: commit
        skill: "(orchestrator) commit-inline — no sub-agent dispatch"

  - id: phase-2
    name: "Code — shared resolution path, call-site migrations, token removal, AST sweep, startup validation, auth simulation hook"
    scs: [SC-3, SC-2, SC-5, SC-1, SC-8, SC-4]
    execution_sequence:
      - "SC-3 shared resolution path precedes call-site migrations that consume it"
      - "SC-2 call-site migrations; SC-5 RED runs while original literals still present, GREEN/verify/commit after SC-2 GREEN (co-located in phase)"
      - "SC-8 auth simulation executes between SC-1 GREEN and SC-1 verify (SC-1 unauthorized-state Playwright requires SC-8 simulation)"
      - "SC-4 startup validation last"
    items:
      - sc: SC-3
        steps: [red, green, verify, commit]
      - sc: SC-2
        steps: [red, green, verify, commit]
      - sc: SC-5
        steps: [red, green, verify, commit]
      - sc: SC-1
        steps: [red, green, verify, commit]
      - sc: SC-8
        steps: [red, green, verify, commit]
      - sc: SC-4
        steps: [red, green, verify, commit]
    skill_task_selection:
      - step: red
        skill: test-driven-development
        dispatch: "task(..., prompt: 'execute red task from test-driven-development')"
      - step: green
        skill: test-driven-development
        dispatch: "task(..., prompt: 'execute green task from test-driven-development')"
      - step: verify
        skill: verification-before-completion
        dispatch: "task(..., prompt: 'execute verify task from verification-before-completion')"
      - step: commit
        skill: "(orchestrator) commit-inline — no sub-agent dispatch"

dependency_dag:
  edges:
    - from: phase-1
      to: phase-2
      reason: "secrets key + docs enablement precedes code phase consuming the key"
    - from: SC-3
      to: SC-1
      reason: "dialog render consumes shared helper"
    - from: SC-3
      to: SC-2
      reason: "streamlit_app call sites migrate to shared helper"
    - from: SC-2
      to: SC-5
      reason: "SC-5 GREEN/verify follow SC-2 literal removal (SC-5 RED precedes SC-2 GREEN, same phase)"
    - from: SC-8
      to: SC-1
      reason: "SC-1 unauthorized-state Playwright verify requires SC-8 simulation (plan dependency edge SC-1←SC-8)"
  internal_phase_edges:
    - "SC-8 green between SC-1 green and SC-1 verify within phase-2"

triplet_co_location:
  verified: true
  note: "Every SC's RED, GREEN, and COMMIT steps are assigned to the same phase (SC-1..SC-7, SC-9? none; SC-5's RED/GREEN interleaving with SC-2 is within-phase, not split)."

cross_phase_dependency_check:
  verified: true
  note: "Phase-2 RED tests consume only SC-6/SC-7 config/doc outputs (committed in phase-1) or earlier phase-2 commits; no RED depends on output from a later phase. SC-1's RED is written before SC-8 but its verify (Playwright unauthorized-state run) is gated on SC-8 — verify, not RED, is the gated step, so no cross-phase RED dependency violation."
