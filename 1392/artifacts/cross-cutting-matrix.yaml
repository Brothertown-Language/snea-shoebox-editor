# Cross-Cutting Matrix — Issue 1392 — SCs spanning multiple concerns
spec: .issues/1392/spec.md
status: backfilled

cross_cutting:
  - sc: SC-3
    spans: [contact-resolution-core, live-browser-rendering, fail-fast-startup-validation]
    why: >
      The shared resolution helper is consumed by the login dialog (SC-1), the
      database-error dialogs (SC-2), and the startup validation path (SC-4);
      its contract (str return, reads st.secrets) must satisfy all three
      consumers.
  - sc: SC-2
    spans: [contact-resolution-core, live-browser-rendering]
    why: >
      Token removal is only correct once every call site routes through the
      shared path; the rendered dialog (SC-1) is the user-visible proof.
  - sc: SC-5
    spans: [contact-resolution-core, live-browser-rendering]
    why: >
      The sweep RED window is tied to SC-2's removal timing; it guards the
      whole user-facing render-call surface across both dialog families.
  - sc: SC-6
    spans: [configuration-and-documentation-enablement, fail-fast-startup-validation, live-browser-rendering]
    why: >
      The key SC-6 adds to templates is the input for SC-4's startup
      validation and SC-1/SC-8's rendered dialog text — a config concern that
      gates code-phase behavior.
  - sc: SC-8
    spans: [live-browser-rendering, fail-fast-startup-validation]
    why: >
      The simulation hook lives in the identity path but its mode guard reads
      secrets ([runtime] mode) and it unblocks SC-1's behavioral verification;
      it must be inert when the startup/runtime config is production.

single_concern_scs:
  - {sc: SC-1, concern: live-browser-rendering}
  - sc: SC-4
    concern: fail-fast-startup-validation
  - sc: SC-7
    concern: configuration-and-documentation-enablement
