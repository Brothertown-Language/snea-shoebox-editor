# Gloss-space calibration evidence (Issue #1400, SC-1, Phase 1 Item 1).
# All values below are measured from the production-replica verification
# probe recorded at tmp/1400/artifacts/verification-probe.yaml (probe date
# 2026-10-02). No value in this file is guessed: every anchor's rank and
# score come directly from real corpus queries executed through
# src.services.embedding_service.encode (pinned thenlper/gte-small) and the
# identical candidate SQL used by search_semantic(mode='gloss') against the
# local production replica (postgresql://postgres:@localhost:5432/postgres,
# 6,681 embedded glosses).

provenance:
  corpus_pin: thenlper/gte-small
  probe_date: '2026-10-02'
  probe_artifact: tmp/1400/artifacts/verification-probe.yaml
  embedded_gloss_count: 6681
  corpus: local production replica, postgresql://postgres:@localhost:5432/postgres
  encode_path: src.services.embedding_service.encode (pinned thenlper/gte-small INT8 ONNX, unit-normalized float32 384-dim)
  measurement_method: >-
    Cosine similarity via SELECT record_id,
    1 - (embedding <=> CAST(:qv AS vector)) AS score FROM gloss_search_entries
    WHERE embedding_model='thenlper/gte-small' AND embedding IS NOT NULL
    ORDER BY score DESC, record_id ASC — the same candidate SQL used by
    search_semantic(mode='gloss') in src/services/semantic_search_service.py.

