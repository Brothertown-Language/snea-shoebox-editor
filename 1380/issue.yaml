body: '# SPEC: AI Agent Ready Progressive Read Markdown Format for MDF Master Doc


  ## Intent / Executive Summary


  Convert the MDF 1.9a master documentation (`docs/mdf/MDFields19a_UTF8.txt`) from
  Toolbox/Shoebox help format into a structured, progressively readable Markdown directory
  optimized for AI agent consumption. The output uses markdown-native navigation (links,
  frontmatter, anchors) — no JSON files — with token-efficient chunking for LLM context
  windows.


  ## Root Cause


  The source file is a monolithic Toolbox-format help database (130,520 bytes; fields
  may wrap onto continuation lines). AI agents cannot efficiently read the single
  file in one pass — they need progressive disclosure: a top-level index, per-marker
  detail files, and topic discussions, each independently loadable via `read_file`.


  ## Approach


  Three-level progressive read structure:


  - **Level 1** (`index.md`): TOC with all `\key` marker codes as markdown links to
  Level 2 files, one-line summaries, token budget < 2k tokens

  - **Level 2** (`markers/{code}.md`): One file per entry with full definition, hierarchy,
  examples, cross-refs as markdown links resolving to the target marker''s detail
  file

  - **Level 3** (`topics/{topic}.md`): Topic discussions (hierarchy, formatting, character
  styles, etc.)


  Each level independently loadable — agent reads only what it needs.


  ## Alternatives Considered


  | Alternative | Rejected Because |

  |---|---|

  | Single large Markdown file | Exceeds LLM context window for full read; no progressive
  disclosure |

  | JSON-based navigation | LLMs navigate markdown links more reliably than JSON parsing;
  violates SC-6 |

  | Database (SQLite) | Adds dependency; markdown is zero-dependency and universally
  readable |

  | Split by section only | Loses per-marker granularity needed for targeted lookups
  |


  ## Key Decisions


  1. **Markdown-only output**: No JSON, no database — all navigation via markdown
  links and frontmatter

  2. **Per-entry files**: Each `\key` entry gets its own file under `markers/` for
  atomic loading, named for the entry''s first code; a multi-code entry is one entry
  whose file covers all its codes, with the frontmatter `marker` field listing them

  3. **Bidirectional cross-refs**: `\cf` references become forward links in the referencing
  entry''s detail file + a backlinks section in the target entry''s detail file

  4. **Frontmatter YAML**: Every file includes `marker`, `category`, `hierarchy_level`,
  `cross_refs`, `tokens_estimate` for agent parsing

  5. **Token budgets**: Each chunk < 4k tokens; Level 1 index < 2k tokens. Token counts
  throughout this spec are measured as ⌈bytes ÷ 4⌉ (`wc -c` / 4)

  6. **Source fidelity**: Toolbox format fully preserved — round-trip conversion must
  be possible


  ## Source


  `docs/mdf/MDFields19a_UTF8.txt` — 130,520-byte Toolbox-format database (UTF-8; fields
  begin with a `\marker` and may wrap onto continuation lines) with:


  - 108 `\key` entries (lines beginning with `\key`), carrying 121 distinct codes;
  each code names exactly one entry — one entry (the verb paradigm markers, `\key
  1s 1p 1e 1i 1d 2s 2p 2d 3s 3p 3d 4s 4p 4d`) carries fourteen codes, every other
  entry one

  - 297 `\cf` cross-reference lines (lines beginning with `\cf`)

  - 425 `\ftx` example fields (lines beginning with `\ftx`)

  - Other markers present include: `\shd`, `\shd2`, `\shd3`, `\shd4`, `\txt`, `\fxv`,
  `\nt`, `\nwt`, `\bib`, `\typ`


  **Content units.** A `\key` entry block is its `\key` line through the line preceding
  the next line beginning with `\key`, continuation lines included. A `\cf` field
  and an `\ftx` field each comprise their marker line plus the immediately following
  non-blank lines that do not begin with `\`. The file preamble is every line before
  the first `\key` line. Content comparisons normalize horizontal whitespace runs
  to single spaces; every other character compares exactly.


  **Cross-reference derivation.** A `\cf` field''s whitespace-separated tokens name
  cross-reference targets as follows:


  1. A token beginning with `\` names the `\key` entry whose code equals the token
  with its leading `\` and trailing punctuation removed.

  2. A token containing `*` names the marker family listed for it in the star-family
  table below; a `*` token not listed there names nothing.

  3. A bare token — no `\`, no `*` — names the `\key` entry whose code equals the
  token with its surrounding punctuation removed only when it stands at a reference
  position: a token that begins its line within the field, a token preceded by a whitespace
  run of two or more characters, a token immediately preceded by a comma, or a code-equal
  token inside a parenthetical that itself contains a comma. Code-equal bare tokens
  elsewhere are description prose and name nothing.


  **Star families.** Families follow the source''s own notation note (a starred marker
  denotes the set of language markers for the same field across language variants
  — the note documents `de*` as `dv`, `dn`, `dr`, `de`) and the marker series the
  source''s entries present:


  | Star token | Family (`\key` codes) |

  |------------|------------------------|

  | `de*` | de, dn, dr, dv |

  | `ee*` | ee, en, er, ev |

  | `ge*` | ge, gn, gr, gv |

  | `lv*` | lf, le, ln, lr, lv |

  | `oe*` | oe, on, or, ov |

  | `pdv*` | pd, pde, pdl, pdn, pdr, pdv |

  | `re*` | re, rn, rr |

  | `ue*` | ue, un, ur, uv |

  | `va*` | va, ve, vn, vr |

  | `ve*` | va, ve, vn, vr |

  | `we*` | we, wn, wr |

  | `xv*` | xe, xn, xr, xv |


  ## Output Structure


  ```

  docs/mdf/ai-progressive/

  ├── index.md                    # Level 1: TOC + summary table of all `\key` entries
  with links

  ├── markers/

  │   ├── lx.md                   # Level 2: \lx detail with frontmatter

  │   ├── ge.md

  │   ├── ps.md

  │   └── ... (one file per `\key` entry)

  ├── topics/

  │   ├── hierarchy-standard.md

  │   ├── hierarchy-alternate.md

  │   ├── formatting-printing.md

  │   ├── character-styles.md

  │   ├── range-sets.md

  │   └── old-changed-markers.md

  └── README.md                   # Navigation guide for agents

  ```


  ## Affected Files


  | File / Directory | Action | Description |

  |------------------|--------|-------------|

  | `docs/mdf/ai-progressive/` | Create | Output directory — tracked deliverable containing
  all generated Markdown files |

  | `docs/mdf/ai-progressive/index.md` | Create | Level 1 TOC with all `\key` entries
  |

  | `docs/mdf/ai-progressive/markers/*.md` | Create | Level 2 per-entry detail files
  (one per `\key` entry) |

  | `docs/mdf/ai-progressive/topics/*.md` | Create | Level 3 topic discussion files
  |

  | `docs/mdf/ai-progressive/README.md` | Create | Navigation guide for agents |


  ## Success Criteria


  | ID | Criterion | Evidence Type | Verification Method |

  |----|-----------|---------------|---------------------|

  | SC-1 | Every `\key` entry in the source file has an individual detail file under
  `markers/` — named for the entry''s first `\key` code, with frontmatter containing
  `marker` (the entry''s code or codes), `category`, `hierarchy_level`, `cross_refs`,
  and `tokens_estimate` | `structural` | Script comparison: the set of detail files
  equals the set of `\key` entries extracted from the source file (file name = entry''s
  first code); each file parses as valid YAML frontmatter carrying all 5 required
  fields |

  | SC-2 | Level 1 `index.md` loads in < 2,000 tokens under the token measure defined
  in Key Decisions | `string` | Token measure of `index.md` < 2,000 tokens |

  | SC-3 | Every cross-reference derived from the source''s `\cf` fields under the
  Cross-reference derivation rule is resolved bidirectionally: the referencing entry''s
  detail file contains a forward link resolving to the target entry''s detail file,
  and the target entry''s detail file contains a `## Backlinks` section listing the
  referencing entry | `structural` | Script comparison with no hardcoded totals: extract
  the (source entry → target entry) pair set from the source''s `\cf` fields per the
  Cross-reference derivation rule (a reference to any of an entry''s codes targets
  that entry); extract the forward-link pair set by resolving every markdown link
  in each `markers/*.md` outside its `## Backlinks` section to the entry whose detail
  file it names; extract the backlink pair set from each file''s `## Backlinks` section;
  the source pair set must equal the forward-link set, and the backlink set must equal
  its inverse |

  | SC-4 | Token estimates in frontmatter (`tokens_estimate`) are within ±20% of the
  file''s actual token count under the token measure defined in Key Decisions, for
  every generated file | `structural` | A script computes the token measure (⌈bytes
  ÷ 4⌉) of every generated file under `docs/mdf/ai-progressive/` and verifies `tokens_estimate`
  is within ±20% of it for each file; no sampling |

  | SC-5 | Source Toolbox content is preserved through round-trip conversion (Toolbox
  → Markdown → Toolbox). Composite check with 4 sub-checks, each passing independently:
  (a) every `\key` entry block is reproduced with identical content, (b) every `\cf`
  field is reproduced with identical content, (c) every `\ftx` field is reproduced
  with identical content, (d) the file preamble is reproduced with identical content
  | `behavioral` | Run the conversion script on the source, then the reverse script
  on the output; extract the multiset of `\key` entry blocks, of `\cf` fields, and
  of `\ftx` fields from both the original source and the round-trip output, and compare
  the preamble text; each sub-check requires equality under the Content units comparison
  rule |

  | SC-6 | Zero JSON files in `docs/mdf/ai-progressive/` — all navigation via markdown
  links and frontmatter | `string` | `find docs/mdf/ai-progressive/ -name ''*.json''`
  returns empty |

  | SC-7 | All generated Markdown files are written to `docs/mdf/ai-progressive/`:
  `index.md`, one `markers/{code}.md` per `\key` entry in the source, the `topics/`
  files listed in Output Structure, and `README.md` | `structural` | The `markers/`
  file set equals the set of `\key` entries extracted from the source (file name =
  entry''s first code); `index.md`, the enumerated `topics/` files, and `README.md`
  exist on disk |

  | SC-8 | The output directory `docs/mdf/ai-progressive/` is committed to the repository
  (not gitignored) so that other specs can reference individual marker files as artifacts
  | `structural` | `git ls-files docs/mdf/ai-progressive/` lists every generated file:
  the tracked file set equals the generated on-disk file set, with no generated file
  ignored or untracked |


  ## Implementation Phases


  ### Phase 1: Parser & Index Generation

  - Build a parser for the Toolbox format that extracts `\key`, `\cf`, and `\ftx`
  fields per the Content units definitions and carries all remaining field content
  — including `\shd`, `\shd2`, `\shd3`, `\shd4`, `\txt`, `\fxv`, `\nt`, `\nwt`, `\bib`,
  `\typ` — verbatim within entry blocks

  - Generate `index.md` with all `\key` entries as a markdown table

  - Verify SC-2 (index < 2k tokens)


  ### Phase 2: Per-Entry File Generation

  - Generate one `markers/{code}.md` file per `\key` entry with full frontmatter

  - Include definition, hierarchy, examples, and cross-refs

  - Verify SC-1 (detail files with frontmatter)


  ### Phase 3: Cross-Reference Resolution

  - Resolve every `\cf` cross-reference bidirectionally per the Cross-reference derivation
  rule, including the star-family table

  - Add backlinks sections to each target file

  - Verify SC-3 (bidirectional resolution)


  ### Phase 4: Topic Files & Token Budgets

  - Generate topic-level files under `topics/`

  - Compute and embed `tokens_estimate` in frontmatter

  - Verify SC-4 (token estimate accuracy)


  ### Phase 5: Round-Trip Verification

  - Implement reverse conversion (Markdown → Toolbox)

  - Run the round-trip test over all `\key` entries

  - Verify SC-5 (round-trip fidelity)


  ### Phase 6: Cleanup & Final Verification

  - Remove any JSON artifacts

  - Verify SC-6 (zero JSON files)

  - Verify SC-7 (all files present in output directory)

  - Verify SC-8 (output directory committed and tracked)

  - Run full SC audit


  ## Requirements → SCs → Phases Traceability


  | Requirement | SC ID | Phase |

  |-------------|-------|-------|

  | Every `\key` entry has an individual detail file with frontmatter | SC-1 | Phase
  2 |

  | Level 1 index loads in < 2,000 tokens | SC-2 | Phase 1 |

  | Every `\cf` cross-reference resolved bidirectionally | SC-3 | Phase 3 |

  | Token estimates within ±20% of actual for every generated file | SC-4 | Phase
  4 |

  | Round-trip fidelity: `\key`, `\cf`, `\ftx`, and preamble content preserved | SC-5
  | Phase 5 |

  | Zero JSON files in output directory | SC-6 | Phase 6 |

  | All generated files written to `docs/mdf/ai-progressive/` | SC-7 | Phase 6 |

  | Output directory committed to repository (not gitignored) | SC-8 | Phase 6 |


  ## Type


  SPEC (AI agent documentation format — markdown native)


  🤖 Co-authored with AI: OpenCode (huggingface/zai-org/GLM-5.3-Flash)

  '
