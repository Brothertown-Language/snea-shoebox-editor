# State Analysis — Issue 1407
# State carrier: st.session_state. Z3 variables mirror plan-item completion for tools/solve check.

variables:
  item1_complete: true
  item2_complete: true
  item3_complete: true
  item4a_complete: true
  item4b_complete: true

state_keys:
  _search_input_key:
    kind: int counter
    transition: incremented by clear (x) button handler (records.py line ~59); widget recreated with new suffix
  search_query:
    kind: str committed query
    transition: written by on_search_change (Enter/blur) and magnifier button path
  current_page:
    kind: int
    transition: reset to 1 on every search commit (both paths)

transitions:
  SC-1: typing -> Enter/blur -> on_search_change -> reads current suffixed key -> commit search_query -> current_page=1 -> rerun renders filtered results
  SC-2: clear click -> _search_input_key++ -> widget empty -> Enter -> callback reads CURRENT suffix (empty) -> commits empty string -> no stale re-search
  SC-3: button click -> commit search_query + current_page=1 -> exactly one commit per click (unchanged)
  SC-4a: label string changed from "Enter text..." to neutral wording; session state unaffected
  SC-4b: no state change - suite-wide verification

invariants:
  - callback never writes its own widget key
  - no st.rerun inside callback
  - Unicode/IPA query strings pass through verbatim (R-10)
