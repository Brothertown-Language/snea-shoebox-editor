# Interface Compatibility — Issue 1407

> Interface boundaries between affected modules.

interfaces:
  - name: records-sidebar-text_input-contract
    source: src/frontend/pages/records.py st.text_input block
    target: Streamlit widget-state machinery (session_state keys)
    contract: >
      Widget key remains dynamically suffixed `search_query_input_{_search_input_key}`;
      callback `on_search_change` reads the current suffixed key and writes ONLY backing
      state keys `search_query` and `current_page` — never its own widget key (R-4),
      never via diff+rerun pattern (R-5). `on_change` fires on Enter AND on blur —
      accepted semantics per spec Edge Cases.
  - name: e2e-selector-contract
    source: src/frontend/pages/records.py text_input aria-label (placeholder/label text)
    target: test/ui/test_semantic_search_ui_flow_e2e.py locator (line 248)
    contract: aria-label string in the E2E locator MUST equal the rendered text_input label;
      changing the placeholder REQUIRES updating the selector in the same delivery cycle (R-9).

removed_interfaces: []
breaking_changes: []
  - none — no public API, schema, or serialized-format change; single-page UI behavior restoration

dependency_contract:
  - source: records-sidebar-text_input-contract
    target: streamlit-session-state
    type: runtime-behavior
    constraint: callback reads dynamic suffix key; writes search_query + current_page only; no self-key write; no st.rerun
  - source: e2e-selector-contract
    target: test_ui_aria_label_locator
    type: string-equality
    constraint: locator aria-label == text_input label string; updated in same cycle as placeholder change
