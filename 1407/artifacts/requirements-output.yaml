    verification: clear preamble records.py:56-59; counter read via st.session_state.get('_search_input_key', 0) in both widget key (records.py:373) and button (records.py:459) — callback must use the same dynamic read
  - id: R-8
    text: Search triggering must work in all search modes (Headword/Gloss/Lexeme/FTS/Semantic Gloss/Semantic All) — the commit point is mode-agnostic (search_term at records.py:200 drives both exact and semantic dispatch)
    verification: records.py:200, 229-261

