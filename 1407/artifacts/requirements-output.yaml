    text: Wire Enter key to execute the search in the Records sidebar text_input
    verification: records.py:374-379 text_input currently has no on_change (verified by read); commit 83d7420 shows on_change=on_search_change was present pre-regression
  - id: R-2
    text: on_search_change must read the suffixed key search_query_input_{_search_input_key}, not the stale un-suffixed search_query_input
    verification: records.py:373 builds the suffixed key; dead callback at records.py:170-172 reads `st.session_state.search_query_input` (un-suffixed — no such widget key exists since 907843d)
  - id: R-3
    text: Enter path resets current_page to 1 and commits the query exactly as the 🔍 button path does
    verification: button path records.py:458-462 sets search_query from the suffixed key, sets current_page=1, st.rerun(); current code has NO URL-param handling (grep for update_url_params/st.query_params in records.py returned nothing), so "match button URL-param behavior" resolves to matching the button's session-state behavior — no URL work to replicate
  - id: R-4
    text: Re-attach on_change=on_search_change to the text_input
    verification: attachment absent today; every sibling filter widget (records.py:390-399 et al.) uses on_change — established page convention
  - id: R-5
    text: Do NOT re-add the old diff+rerun pattern
    verification: constraint from issue; Streamlit forbids callbacks writing to their own widget key; pattern must be pure callback state commit (callback fires pre-rerun; no explicit rerun needed)
  - id: R-6
    text: Change the placeholder from "Enter text..." to neutral wording (no Enter instruction)
    verification: records.py:375 currently "Enter text..."

