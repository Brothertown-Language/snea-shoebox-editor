date: 2026-10-03

decomposition_units:
  - item: 1
    sc_id: SC-1
    title: Enter executes the search (callback re-attach + suffixed-key read)
    interface:
      inputs: suffixed widget key `search_query_input_{st.session_state.get('_search_input_key', 0)}` value
      outputs: st.session_state.search_query committed, st.session_state.current_page = 1
      invariants: callback never writes to its own widget key; read is dynamic (post-clear suffix safe)
      failure_modes: APIException on widget-key self-write (must not occur); stale-key read after clear (must not occur)
    red_green:
      red: AppTest in-process wiring smoke asserting on_change attachment + search_query commit on Enter (fails before change)
      green: corrected on_search_change (dynamic suffixed read, page reset) + on_change=on_search_change on text_input records.py:374-379
      behavioral_evidence: Playwright live-browser — Enter in the search box renders filtered results (docs/development/ui_testing_standard.md standard of record)
    commit: one RED→GREEN→COMMIT cycle

  - item: 2
    sc_id: SC-2
    title: No spurious re-search after clear
    interface:
      inputs: _search_input_key counter (records.py:59), clear preamble ordering (before widget instantiation)
      outputs: after ❌ clear, input is empty and search_query stays empty; no residual query committed
      invariants: callback reads current suffix; clear preamble still runs before widget creation
      failure_modes: stale suffix read re-committing old query; clear+Enter race
    red_green:
      red: AppTest clear-then-verify sequence asserting empty state persists (fails if stale read present)
      green: covered by the same dynamic-suffix read; test guards the interplay
      behavioral_evidence: Playwright — clear then confirm no re-search
    commit: one RED→GREEN→COMMIT cycle (depends on item 1)

  - item: 3
    sc_id: SC-3
    title: 🔍 button path unchanged — no double-commit
    interface:
      inputs: search_trigger button click (records.py:458-462)
      outputs: identical pre-change behavior — single commit of the suffixed-key value
      invariants: button code byte-identical or semantically unchanged; button and callback both committing produce the same final state (idempotent — same value written to search_query)
      failure_modes: double rerun or divergent page-reset values (must not occur)
    red_green:
      red: AppTest button-click smoke asserting exactly one commit + unchanged results (passes before AND after — regression guard; red phase = test exists and pins current behavior)
      green: verify no behavioral delta in button path
      behavioral_evidence: Playwright — button click still executes search once
    commit: one RED→GREEN→COMMIT cycle (independent of item 1 code, ordered after item 1 for verification context)

  - item: 4
    sc_id: SC-4
    title: Neutral placeholder + zero regressions
    interface:
      inputs: records.py:375 label string
      outputs: placeholder no longer reads as an Enter instruction; suite passes
      invariants: no other widget labels change
      failure_modes: E2E selector coupling — test/ui/test_semantic_search_ui_flow_e2e.py:248 locates input via aria-label "Enter text..." and MUST be updated in the same cycle
    red_green:
      red: string-level check asserting placeholder ≠ "Enter text..." (fails before change)
      green: neutral wording (e.g., "Search...") + selector update
      behavioral_evidence: Playwright screenshot/render review of the placeholder; full pytest suite run for zero regressions
    commit: one RED→GREEN→COMMIT cycle

dependency_dag:
  edges: [1→2, 1→3 (verification context only), 1→4 (order only)]
  acyclic: true
  note: items 2-4 depend on item 1 being in place for meaningful verification; no cycles

atomicity_check: each SC maps to exactly one RED→GREEN→COMMIT cycle — PASS
single_concern_check: each SC targets one file (records.py) and one verification domain — PASS
phase_structure: single-phase spec (one file, small surface) — no multi-phase pre/per/post structure required
